<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dossiê de Natal: As 25 Combinações Secretas</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--green:#0e3b2c;--green2:#08241b;--gold:#d4a64a;--gold2:#f3d37a;--red:#b3262e;--bg:#f4ead7;--card:#fffaf0;--soft:#f3e6cf;--ink:#2a1a14;--line:#e6d6b8;--ok:#5f8f5a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f2219;--card:#1a2f25;--soft:#233b2f;--ink:#f6ead2;--line:#35503f}}
:root[data-theme="dark"]{--bg:#0f2219;--card:#1a2f25;--soft:#233b2f;--ink:#f6ead2;--line:#35503f}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 76px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 'Nunito',system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--green2);z-index:60}
h1,h2,.big,.cs{font-family:'Playfair Display',Georgia,serif}
a{color:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--green2);color:#fff8ea;display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:2px solid var(--gold)}
.bar button{min-width:48px;min-height:44px;border:2px solid var(--gold);background:transparent;color:var(--gold2);border-radius:12px;font:800 13px 'Nunito',sans-serif;cursor:pointer}
.mid{flex:1;min-width:0;font-size:12px;font-weight:800;letter-spacing:.5px}
.mid .t{display:flex;justify-content:space-between;color:var(--gold2)}
.track{height:8px;border-radius:8px;background:rgba(255,255,255,.2);overflow:hidden;margin-top:4px}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--gold2));transition:width .4s}
main{max-width:780px;margin:0 auto;padding:16px}
.cover{background:radial-gradient(circle at 50% 0,#14563f,var(--green2));border-radius:20px;padding:14px;margin-bottom:16px}
.fr{border:2px solid var(--gold);border-radius:14px;padding:30px 14px;text-align:center;color:#fff8ea;outline:1px solid rgba(243,211,122,.5);outline-offset:-10px}
.fr small{color:var(--gold2);letter-spacing:4px;font-weight:800;font-size:12px}
.big{font-size:clamp(52px,16vw,96px);line-height:1;margin:10px 0 0;color:var(--gold2)}
.de{letter-spacing:10px;font-weight:800;font-size:20px;margin-bottom:18px}
.med{width:120px;height:120px;margin:0 auto 14px;border-radius:50%;border:4px solid var(--gold);outline:2px solid rgba(243,211,122,.5);outline-offset:6px;display:flex;align-items:center;justify-content:center;font-size:56px;background:rgba(0,0,0,.25)}
.as{color:var(--gold2);letter-spacing:8px;font-weight:800}
.cs{font-size:clamp(30px,9vw,52px);margin:4px 0 12px;line-height:1.1}
.mp{font-size:12px;letter-spacing:2px;color:var(--gold2);margin:0}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 20px}
.btn{display:inline-block;min-height:48px;padding:12px 20px;border-radius:14px;border:2px solid var(--red);background:var(--red);color:#fff;font:800 16px 'Nunito',sans-serif;text-decoration:none;cursor:pointer;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--gold)}
.pg h1{font-size:clamp(28px,7vw,40px);line-height:1.15;color:var(--red);margin:6px 0 10px}
.pg h2,.rec h2{font-size:24px;margin:26px 0 8px;color:var(--green);display:flex;gap:10px;align-items:baseline;justify-content:space-between}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .pg h2,:root:not([data-theme="light"]) .rec h2{color:var(--gold2)}:root:not([data-theme="light"]) .pg h1{color:var(--gold2)}}
.pg h3,.rec h3{font-size:16px;margin:16px 0 4px;letter-spacing:.5px;color:var(--red)}
.o{font:800 14px 'Nunito',sans-serif;color:var(--ok)}
.muted{opacity:.7}
.mc,.rc{display:flex;flex-direction:column;gap:2px;padding:14px 16px;margin:10px 0;border:2px solid var(--gold);border-radius:16px;background:var(--card);text-decoration:none;position:relative;transition:transform .15s}
.mc:hover,.rc:hover{transform:translateY(-2px)}
.mc b,.rc .nm{color:var(--red);font-size:12px;letter-spacing:2px;font-weight:800}
.mc span{font:700 20px 'Playfair Display',serif}
.mc em{font-style:normal;font-size:13px;color:var(--ok);font-weight:800}
.rc .tt{font:700 19px/1.3 'Playfair Display',serif;padding-right:34px}
.rc .mt{font-size:13px;opacity:.7}
.rc .ck{display:none;position:absolute;right:14px;top:14px;width:28px;height:28px;border-radius:50%;background:var(--ok);color:#fff;align-items:center;justify-content:center;font-weight:800}
.rc.done{background:#e8f1e3;border-color:var(--ok)}.rc.done .ck{display:flex}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rc.done{background:#24432f}}
.rh{background:var(--green2);color:#fff8ea;border-radius:18px;padding:20px 18px;border:2px solid var(--gold)}
.rh h1{margin:8px 0 10px;font-size:clamp(26px,6.5vw,38px);line-height:1.15;color:var(--gold2)}
.tag{font-size:12px;letter-spacing:2px;font-weight:800;color:var(--gold2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips span{background:rgba(255,255,255,.12);border-radius:20px;padding:4px 12px;font-size:14px;font-weight:700}
.cb{display:flex;gap:12px;align-items:flex-start;padding:7px 0;cursor:pointer}
.cb input{width:28px;height:28px;flex:none;accent-color:var(--ok);cursor:pointer;margin:0}
.cb .lb{flex:1}
.cb.on .lb{opacity:.55}
.cb.big,.cb.sel{background:rgba(255,255,255,.1);border-radius:12px;padding:10px 12px;margin-top:8px;font-weight:800;align-items:center}
.cb .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--red);color:#fff;font:800 14px/28px 'Nunito',sans-serif;text-align:center}
.steps{list-style:none;margin:0;padding:0}
.steps li{border-bottom:1px solid var(--line)}
.callout{background:var(--soft);border-left:6px solid var(--gold);border-radius:12px;padding:14px 16px;margin:12px 0}
.callout b{color:var(--red)}
.pairs a.x{display:inline-block;background:var(--red);color:#fff;border-radius:12px;padding:0 9px;text-decoration:none;font-weight:800;font-size:14px}
.pg a.x{background:var(--red);color:#fff;border-radius:10px;padding:0 8px;text-decoration:none;font-weight:800;font-size:14px}
textarea{width:100%;min-height:90px;padding:12px;border:2px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);font:16px 'Nunito',sans-serif}
.nav{display:flex;gap:10px;justify-content:space-between;margin:28px 0 10px;flex-wrap:wrap}
.nav a{flex:1;min-width:110px;text-align:center;padding:12px;border:2px solid var(--gold);border-radius:14px;text-decoration:none;font-weight:800;background:var(--card)}
.bn{display:flex;gap:12px;padding:14px 16px;margin:10px 0;border:2px dashed var(--gold);border-radius:16px;background:var(--card)}
.bn .ic{font-size:30px}.bn b{display:block;font:700 18px 'Playfair Display',serif}.bn small{color:var(--red);font-weight:800;letter-spacing:1px}
.drawer{position:fixed;inset:0 auto 0 0;width:min(88vw,360px);background:var(--card);transform:translateX(-105%);transition:transform .25s;z-index:70;overflow:auto;padding:calc(env(safe-area-inset-top,0px) + 16px) 16px 24px;border-right:3px solid var(--gold)}
.drawer.open{transform:none}
.drawer a{display:block;padding:9px 6px;text-decoration:none;border-bottom:1px solid var(--line);font-size:16px}
.drawer h4{margin:16px 0 4px;color:var(--red);font-size:12px;letter-spacing:2px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:65;display:none}.ov.open{display:block}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.modal.open{display:flex}
.modal div{background:var(--card);border-radius:18px;padding:24px;max-width:380px;border:2px solid var(--gold);text-align:center}
.foot{text-align:center;font-size:13px;opacity:.7;margin:30px 0 10px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media print{.bar,.drawer,.ov,.cta,.nav,.btn,.cb.sel,.modal{display:none!important}body{background:#fff;color:#000}.rh{background:#fff;color:#000;border-color:#000}.rh h1,.tag{color:#000}.chips span{background:#eee}.cb input{outline:2px solid #000}section{break-inside:avoid}}
.sh{background:#fff;color:#222;border:2px dashed var(--gold);border-radius:14px;padding:14px;margin:12px 0}
.sh h3{margin-top:0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc{border:2px dashed #999;border-radius:8px;padding:8px;text-align:center;background:#fff}
.pc small{display:block;color:#b3262e;font-weight:800;letter-spacing:2px;font-size:10px}
.pi{width:100%;border:0;border-bottom:1px solid #999;background:transparent;font:700 16px 'Playfair Display',serif;text-align:center;color:#222;padding:6px 2px;margin:4px 0}
.mn{text-align:center;padding:14px}.mn h2{display:block;text-align:center;color:#b3262e}.mn label{display:block;text-align:left;font-weight:800;font-size:13px;color:#b3262e}
.shp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.shp svg{width:100%;height:auto;border:1px dashed #999;border-radius:8px;background:#fff}
.tb{width:100%;border-collapse:collapse;font-size:14px;margin:10px 0}.tb th,.tb td{border:1px solid var(--line);padding:6px;text-align:center}.tb th{background:var(--green2);color:var(--gold2)}
.pal{display:inline-block;background:var(--soft);border-radius:20px;padding:2px 12px;font-weight:800;font-size:14px}
@media print{body.ps *{visibility:hidden}body.ps .tg,body.ps .tg *{visibility:visible}body.ps .tg{position:absolute;left:0;top:0;width:100%;border:0}.np{display:none!important}}
</style>
</head>
<body>
<header class="bar">
<button data-act="menu" aria-label="Abrir menu">☰ MENU</button>
<div class="mid"><div class="t"><span>MEU PROGRESSO: <span id="cnt">0 / 25</span> RECEITAS</span><span id="pct">0%</span></div><div class="track"><div id="fill"></div></div></div>
