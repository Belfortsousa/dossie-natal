const pb='<button class="btn ghost np" data-act="ps">🖨 Imprimir esta folha</button>',rg=(n,f)=>[...Array(n)].map((_,i)=>f(i+1)).join('');
function prints(){const sv=(a,p)=>`<svg viewBox="0 0 100 100" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3" aria-label="${a}">${p}</svg>`;
return `<div class="sh"><h3>1. Marcadores de lugar</h3><p>Escreva o nome, imprima, recorte e dobre ao meio.</p><div class="pgrid">${rg(8,i=>`<div class="pc"><small>FELIZ NATAL</small><input class="pi" data-t="b1-pl${i}" aria-label="Nome ${i}" placeholder="Nome"><small>✦ ✦ ✦</small></div>`)}</div>${pb}</div>
<div class="sh"><h3>2. Etiquetas de presente</h3><div class="pgrid">${rg(6,i=>`<div class="pc"><small>PARA</small><input class="pi" data-t="b1-tp${i}" aria-label="Para ${i}"><small>DE</small><input class="pi" data-t="b1-td${i}" aria-label="De ${i}"></div>`)}</div>${pb}</div>
<div class="sh mn"><h2>Cardápio de Natal</h2>${['Entrada','Prato principal','Acompanhamentos','Saladas','Sobremesa','Bebidas'].map((x,i)=>`<label>${x}<input class="pi" data-t="b1-cd${i}" aria-label="${x}"></label>`).join('')}${pb}</div>
<div class="sh"><h3>4. Moldes para recortar</h3><p>Imprima, recorte e use como enfeite de mesa, árvore ou janela.</p><div class="shp">${sv('Estrela','<polygon points="50,5 61,38 96,38 68,58 78,92 50,71 22,92 32,58 4,38 39,38"/>')}${sv('Árvore','<polygon points="50,6 78,40 64,40 88,70 12,70 36,40 22,40"/><rect x="43" y="70" width="14" height="20"/>')}${sv('Bola de Natal','<circle cx="50" cy="58" r="32"/><rect x="42" y="18" width="16" height="10"/><circle cx="50" cy="12" r="6"/>')}${sv('Boneco de neve','<circle cx="50" cy="25" r="16"/><circle cx="50" cy="62" r="26"/>')}</div>${pb}</div>`}
function bpage(n){const b=Bn[n-1],q=Bn[n];let h=`<section class="pg"><h1>${b.ico} ${b.name}</h1><p>${b.intro}</p>`;
if(b.kind==='print')h+=prints();else if(b.des)h+=b.des.map(d=>`<a class="rc" href="#${d.id}"><span class="nm">SOBREMESA ${d.i+1}</span><span class="tt">${d.title}</span><span class="mt">⏱ ${d.tempo} • ${d.dif}</span></a>`).join('');else h+=b.blocks.map((x,i)=>blk(x,b.id+'-'+(i+1))).join('');
return h+`<div class="nav"><a href="#bonus">Biblioteca de Bônus</a>${q?`<a href="#${q.id}">Próximo bônus →</a>`:'<a href="#home">Início</a>'}</div></section>`}
function dessert(id){const d=DS.find(x=>x.id===id);if(!d)return home();const p=DS[d.i-1],q=DS[d.i+1];let c=0;
return `<article class="rec"><div class="rh"><span class="tag">BÔNUS 4 • SOBREMESA ${d.i+1}</span><h1>${d.title}</h1><div class="chips"><span>👥 ${d.rende}</span><span>⏱ ${d.tempo}</span><span>🔥 ${d.dif}</span></div>${cb(d.id+'-feito','Marcar como feita','big')}</div><section><h2>Um pouco da história</h2><p>${d.hist}</p></section><section data-g><h2>Lista de compras <span class="o"></span></h2>${d.ing.map(x=>{c++;return cb(d.id+'-i'+c,x)}).join('')}</section><section data-g><h2>Modo de preparo <span class="o"></span></h2><ol class="steps">${d.steps.map((s,j)=>`<li>${cb(d.id+'-s'+(j+1),s,'',`<span class="n">${j+1}</span>`)}</li>`).join('')}</ol></section><div class="callout"><b>Dica de ouro:</b> ${d.dica}</div><nav class="nav">${p?`<a href="#${p.id}">← Anterior</a>`:''}<a href="#b4">Todas as sobremesas</a>${q?`<a href="#${q.id}">Próxima →</a>`:''}</nav></article>`}
function upd(){document.querySelectorAll('input[data-k]').forEach(i=>{i.checked=!!S[i.dataset.k];const l=i.closest('label');if(l)l.classList.toggle('on',i.checked)});
document.querySelectorAll('[data-t]').forEach(t=>{if(document.activeElement!==t)t.value=S[t.dataset.t]||''});
document.querySelectorAll('[data-g]').forEach(g=>{const a=[...g.querySelectorAll('input[type=checkbox]')],o=g.querySelector('.o');if(o)o.textContent=a.filter(x=>x.checked).length+' / '+a.length});
const d=R.filter(r=>S[r.id+'-feito']).length;$('#cnt').textContent=d+' / '+R.length;$('#pct').textContent=Math.round(d/R.length*100)+'%';$('#fill').style.width=(d/R.length*100)+'%';
document.querySelectorAll('[data-done]').forEach(e=>e.classList.toggle('done',!!S[e.dataset.done+'-feito']));
document.querySelectorAll('[data-mp]').forEach(e=>{const m=D.mods[e.dataset.mp-1];e.textContent=m.recs.filter(r=>S[r.id+'-feito']).length+' / '+m.recs.length+' receitas feitas'})}
function route(keep){const h=(location.hash||'#home').slice(1);let v;
if(h==='intro')v=intro();else if(h==='sumario')v=sumario();else if(h==='lista')v=lista();else if(h==='bonus')v=bonus();else if(/^m[1-5]$/.test(h))v=modulo(+h[1]);else if(/^b[1-5]$/.test(h))v=bpage(+h[1]);else if(/^d\d\d$/.test(h))v=dessert(h);else if(byId[h])v=recipe(byId[h]);else v=home();
const y=scrollY;$('#app').innerHTML=v;upd();scrollTo(0,keep?y:0);closeD()}
function openD(){$('#dr').classList.add('open');$('.ov').classList.add('open')}
function closeD(){$('#dr').classList.remove('open');$('.ov').classList.remove('open')}
$('#dr').innerHTML=`<a href="#home">🏠 Início</a><a href="#intro">Introdução</a><a href="#sumario">Sumário</a><a href="#lista">🛒 Lista de compras</a>`+D.mods.map(m=>`<h4>MÓDULO ${m.n}: ${m.name.toUpperCase()}</h4>`+m.recs.map(r=>`<a href="#${r.id}">${r.num} ${r.title}</a>`).join('')).join('')+`<h4>BÔNUS</h4><a href="#bonus">Biblioteca de Bônus</a>`+Bn.map(b=>`<a href="#${b.id}">${b.ico} ${b.name}</a>`).join('');
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.k){S[t.dataset.k]=t.checked;save();upd();if(t.dataset.k.startsWith('sel-')&&location.hash==='#lista')route(true)}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.t){S[t.dataset.t]=t.value;save()}});
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const x=a.dataset.act;
if(x==='menu')openD();else if(x==='close')closeD();else if(x==='print')print();else if(x==='ps'){const s=a.closest('.sh');s.classList.add('tg');document.body.classList.add('ps');print();document.body.classList.remove('ps');s.classList.remove('tg')}else if(x==='reset')$('#md').classList.add('open');else if(x==='no')$('#md').classList.remove('open');
else if(x==='yes'){S={};save();$('#md').classList.remove('open');route()}
else if(x==='clear'){R.forEach(r=>{if(S['sel-'+r.id])Object.keys(S).forEach(k=>{if(k.startsWith(r.id+'-i'))delete S[k]})});save();route(true)}});
addEventListener('hashchange',()=>route());
route();
</script>
</body>
</html>
