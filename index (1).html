<main id="app"></main>
<script>
const D={"bonus": [{"id": "b1", "ico": "🎁", "name": "Kit Moldes e Decorações para Imprimir", "sub": "Moldes, etiquetas e cartões prontos para imprimir", "kind": "print", "intro": "Preencha os nomes aqui no app, toque em imprimir e recorte. Use papel mais grosso (180 g) para os cartões ficarem firmes."}, {"id": "b2", "ico": "🍽️", "name": "Mesa dos Sonhos", "sub": "5 estilos de decoração de mesa, com passo a passo", "intro": "Escolha um estilo, marque os itens que você já tem e siga o passo a passo. Cada mesa foi pensada para combinar com os pratos do dossiê.", "blocks": [{"h": "Estilo 1: Clássico Vermelho e Dourado", "pal": "Vermelho, dourado e branco", "ck": ["Toalha ou caminho de mesa vermelho", "Sousplat ou prato dourado", "Guardanapos de tecido brancos", "Laços vermelhos para os guardanapos", "Bolas douradas e vermelhas para o centro", "Velas brancas em castiçais dourados"], "ol": ["Estenda a toalha ou o caminho de mesa e alise bem.", "Coloque o sousplat, o prato e a taça em cada lugar.", "Dobre o guardanapo, prenda com o laço e apoie sobre o prato.", "Monte o centro com bolas, ramos dourados e velas, em alturas diferentes.", "Acenda as velas só quando os convidados chegarem."], "tip": "Mantenha o centro baixo. Assim todos se enxergam do outro lado da mesa."}, {"h": "Estilo 2: Verde Floresta e Natural", "pal": "Verde, madeira e branco", "ck": ["Caminho de mesa de linho ou juta", "Ramos de pinheiro, eucalipto ou alecrim", "Pinhas e fatias de laranja desidratada", "Pratos brancos lisos", "Velas dentro de copos de vidro"], "ol": ["Coloque o caminho de mesa no centro, sem cobrir toda a mesa.", "Espalhe os ramos ao longo do caminho, formando uma guirlanda.", "Intercale as pinhas, a laranja e as velas nos espaços.", "Em cada prato, apoie um raminho de alecrim sobre o guardanapo."], "tip": "Troque os ramos naturais por alecrim fresco: perfuma a mesa e depois vai para a cozinha."}, {"h": "Estilo 3: Branco e Prata, Neve", "pal": "Branco, prata e azul-gelo", "ck": ["Toalha branca bem passada", "Pratos e talheres prateados", "Velas brancas de alturas diferentes", "Bolas prateadas e pinhas brancas", "Pisca-pisca de luz quente"], "ol": ["Estenda a toalha branca e alise os vincos.", "Monte os lugares com pratos e talheres prateados.", "Agrupe as velas e as bolas no centro, em número ímpar (3 ou 5).", "Passe o pisca-pisca entre os itens do centro e ligue na hora da ceia."], "tip": "Luz quente e baixa deixa o branco aconchegante, e não frio."}, {"h": "Estilo 4: Rústico com Madeira e Frutas", "pal": "Madeira, vermelho-romã e verde", "ck": ["Tábua grande de madeira para o centro", "Romãs, laranjas e uvas", "Guardanapos de linho ou xadrez", "Velas pequenas", "Ramos de alecrim"], "ol": ["Coloque a tábua no centro da mesa.", "Monte as frutas em montes, com as romãs em destaque.", "Distribua as velas pequenas entre as frutas.", "Dobre os guardanapos e prenda um ramo de alecrim em cada."], "tip": "As frutas do centro podem virar sobremesa ou o suco do dia seguinte."}, {"h": "Estilo 5: Mesa Infantil Divertida", "pal": "Cores vivas, kraft e estrelas", "ck": ["Papel kraft para cobrir a mesa", "Giz de cera ou canetinhas", "Pratos e copos coloridos", "Cartões com os nomes das crianças", "Biscoitos decorados ou doces coloridos"], "ol": ["Cubra a mesa com o papel kraft e prenda as pontas com fita.", "Deixe giz de cera em potinhos, para as crianças desenharem durante a ceia.", "Coloque um cartão com o nome de cada criança no prato.", "Ponha os doces coloridos em potinhos no centro."], "tip": "Deixe a mesa infantil perto da dos adultos, mas com tudo plástico ou de papel."}]}, {"id": "b3", "ico": "🎲", "name": "Brincadeiras de Natal em Família", "sub": "8 brincadeiras com materiais e regras", "intro": "Brincadeiras simples, que não pedem preparo nenhum e funcionam com crianças, adultos e avós. Escolha duas ou três para a noite.", "blocks": [{"h": "1. Amigo Secreto", "chips": ["👥 6 ou mais", "⏱ 15 min para sortear"], "mat": "Papéis, caneta, saco ou chapéu", "ol": ["Cada pessoa escreve o nome em um papel e coloca no saco.", "Cada um sorteia um nome, sem mostrar a ninguém.", "Combinem um valor máximo para o presente.", "Na ceia, cada um dá uma dica sobre quem tirou, e os outros adivinham antes da revelação."]}, {"h": "2. Bingo de Natal", "chips": ["👥 4 a 20", "⏱ 20 min"], "mat": "Cartelas com figuras ou palavras natalinas, grãos ou botões para marcar", "ol": ["Faça cartelas 3 x 3 com palavras como árvore, estrela, sino, presente, rena, panetone.", "Quem comanda sorteia as palavras de um saquinho e as lê em voz alta.", "Quem completar uma linha ou a cartela grita “Feliz Natal!”.", "Dê um docinho de prêmio."]}, {"h": "3. Mímica Natalina", "chips": ["👥 6 ou mais", "⏱ 20 min"], "mat": "Papéis com palavras, 2 equipes", "ol": ["Escreva palavras natalinas em papéis: Papai Noel, rena, ceia, panetone, presente.", "Divida em duas equipes.", "Cada jogador sorteia um papel e faz mímica, sem falar.", "A equipe tem 1 minuto para acertar. Vence quem somar mais pontos."]}, {"h": "4. Quem Sou Eu?", "chips": ["👥 5 ou mais", "⏱ 15 min"], "mat": "Adesivos ou post-its, caneta", "ol": ["Escreva personagens natalinos em adesivos (Papai Noel, rena, anjo, duende).", "Cole um na testa de cada pessoa, sem ela ver.", "Cada um faz perguntas que só podem ser respondidas com sim ou não.", "Vence quem descobrir primeiro quem é."]}, {"h": "5. Caça ao Presente", "chips": ["👥 Crianças", "⏱ 20 min"], "mat": "Pistas escritas, pequenos presentes ou doces", "ol": ["Esconda um presente pequeno e escreva pistas em papéis.", "Cada pista leva à seguinte, com o último papel no esconderijo do presente.", "Use rimas e desenhos para as crianças menores.", "Acompanhe de perto e ajude com dicas."]}, {"h": "6. Passa o Presente", "chips": ["👥 8 ou mais", "⏱ 15 min"], "mat": "Um presente embrulhado em várias camadas de papel, música", "ol": ["Embrulhe o presente em 8 a 10 camadas, com um docinho entre elas.", "Todos sentam em roda e passam o pacote ao som da música.", "Quando a música para, quem estiver com o pacote tira uma camada.", "Quem tirar a última camada fica com o presente."]}, {"h": "7. Quiz de Natal", "chips": ["👥 Equipes", "⏱ 20 min"], "mat": "Perguntas em papéis, caneta e papel para marcar pontos", "ol": ["Divida a família em duas equipes.", "Faça perguntas simples, como: Que animal puxa o trenó do Papai Noel? Qual é a data do Natal? Que enfeite vai no alto da árvore?", "Cada resposta certa vale 1 ponto.", "Crie perguntas sobre a própria família para animar ainda mais."]}, {"h": "8. Cabine de Fotos", "chips": ["👥 Todos", "⏱ Livre"], "mat": "Fundo de tecido ou pisca-pisca, adereços (chapéus, óculos, laços)", "ol": ["Escolha uma parede e pendure o tecido ou o pisca-pisca.", "Deixe uma caixa com adereços ao lado.", "Peça a cada grupo (casais, crianças, avós) para posar.", "Imprima ou envie as fotos depois, como lembrança da ceia."]}]}, {"id": "b4", "ico": "🍰", "name": "10 Sobremesas Natalinas Extras", "sub": "Dez sobremesas no mesmo formato das receitas", "intro": "Dez sobremesas além das 5 do dossiê. Faça uma ou monte uma mesa de doces completa. Cada uma tem lista de ingredientes e modo de preparo.", "des": [{"id": "d01", "title": "Torre de Choux de Doce de Leite", "rende": "20 bolinhas", "tempo": "1h30", "dif": "Difícil", "hist": "A torre de carolinas é uma sobremesa de festa de inspiração francesa: bolinhas de massa choux empilhadas em formato de árvore.", "ing": ["250 ml de água", "100 g de manteiga", "150 g de farinha de trigo", "4 ovos", "1 pitada de sal", "400 g de doce de leite firme", "1 xícara de açúcar e 1/4 de xícara de água (para o caramelo)"], "steps": ["Ferva a água com a manteiga e o sal. Junte a farinha de uma vez e mexa até desgrudar do fundo.", "Esfrie 5 minutos. Adicione os ovos um a um, mexendo bem, até a massa ficar lisa e brilhante.", "Faça bolinhas em assadeira forrada. Asse a 200 °C por 10 minutos e a 180 °C por 20 minutos, sem abrir o forno.", "Esfrie e recheie com doce de leite, usando um saco de confeitar.", "Faça o caramelo derretendo o açúcar com a água até dourar.", "Monte a torre em cone, colando cada bolinha com um pouco de caramelo."], "dica": "Não abra o forno nos primeiros 20 minutos, ou as bolinhas murcham."}, {"id": "d02", "title": "Maxi Bis com Toque Dourado", "rende": "12 porções", "tempo": "40 minutos (mais 4 horas de geladeira)", "dif": "Fácil", "hist": "Uma sobremesa gelada que lembra o bombom, com camadas crocantes de biscoito wafer e creme de chocolate.", "ing": ["3 pacotes de biscoito wafer de chocolate", "1 lata de leite condensado", "200 g de chocolate meio amargo", "1 caixa de creme de leite", "2 colheres (sopa) de manteiga", "Pó dourado comestível para decorar"], "steps": ["Cozinhe o leite condensado, o creme de leite, o chocolate picado e a manteiga em fogo baixo, mexendo, até virar um creme espesso.", "Esfrie o creme até ficar morno.", "Em uma fôrma retangular forrada com filme, alterne camadas de wafer e creme.", "Termine com creme e leve à geladeira por 4 horas.", "Desenforme e pincele o pó dourado."], "dica": "Pó dourado comestível é vendido em lojas de confeitaria. Sem ele, o doce continua lindo."}, {"id": "d03", "title": "Torta de Marzipã e Ovos Moles", "rende": "10 fatias", "tempo": "1h30", "dif": "Média", "hist": "A combinação de amêndoas e ovos moles é muito ligada à confeitaria portuguesa, e ganha lugar de destaque nas mesas de festa.", "ing": ["1 massa sablée (mesma da Torta de Limão, receita 5.1)", "120 g de manteiga em temperatura ambiente", "120 g de açúcar", "2 ovos", "150 g de amêndoas moídas", "30 g de farinha de trigo", "6 gemas", "1/2 xícara de açúcar e 1/2 xícara de água (para a calda)", "Amêndoas laminadas para decorar"], "steps": ["Forre uma forma de 20 cm com a massa sablée e pré-asse por 15 minutos a 180 °C.", "Bata a manteiga com o açúcar. Junte os ovos, as amêndoas e a farinha.", "Despeje na massa e asse por 30 a 35 minutos, até dourar. Esfrie.", "Faça uma calda fervendo o açúcar e a água por 5 minutos.", "Em fogo baixo, junte as gemas peneiradas à calda e mexa até engrossar, uns 3 a 5 minutos.", "Cubra a torta com o ovos moles e decore com amêndoas."], "dica": "Mexa os ovos moles sempre, e em fogo baixo, para não talhar."}, {"id": "d04", "title": "Palha Italiana de Biscoff", "rende": "25 quadradinhos", "tempo": "30 minutos (mais 3 horas de geladeira)", "dif": "Fácil", "hist": "A palha italiana é um doce brasileiro de brigadeiro com biscoito. Aqui ela ganha o sabor caramelizado do biscoito speculoos.", "ing": ["1 lata de leite condensado", "1 colher (sopa) de manteiga", "150 g de pasta de biscoito speculoos", "200 g de biscoito speculoos triturado", "Açúcar cristal para finalizar"], "steps": ["Leve o leite condensado, a manteiga e a pasta ao fogo baixo, mexendo, até desgrudar do fundo.", "Junte metade do biscoito triturado e misture.", "Despeje em forma untada de 20 x 20 cm e espalhe o restante do biscoito por cima.", "Leve à geladeira por 3 horas.", "Corte em quadrados e passe no açúcar cristal."], "dica": "Pressione levemente o biscoito de cima, para ele grudar no doce."}, {"id": "d05", "title": "Torta Gerbeaud", "rende": "12 fatias", "tempo": "1h30", "dif": "Média", "hist": "Inspirada no doce húngaro de camadas com geleia de damasco e nozes, essa torta é fina, perfumada e perfeita com café.", "ing": ["300 g de farinha de trigo", "150 g de manteiga gelada", "80 g de açúcar", "2 gemas", "1 colher (chá) de fermento", "300 g de geleia de damasco", "150 g de nozes moídas", "Açúcar de confeiteiro para polvilhar"], "steps": ["Misture a farinha, o açúcar e o fermento. Esfarele a manteiga e junte as gemas. Forme uma massa e divida em 3 partes.", "Abra cada parte e asse em forma de 20 cm a 180 °C por 15 a 18 minutos. Esfrie.", "Misture a geleia de damasco com as nozes.", "Monte: disco de massa, recheio, disco, recheio, disco.", "Deixe descansar 4 horas, coberta, antes de servir.", "Polvilhe açúcar de confeiteiro por cima."], "dica": "O descanso amacia as camadas. Quanto mais descansa, mais macia fica."}, {"id": "d06", "title": "Bolo de Nozes", "rende": "12 fatias", "tempo": "1h30", "dif": "Média", "hist": "Um bolo de festa clássico no Brasil: massa leve com nozes, recheada com doce de leite e coberta de chantilly.", "ing": ["4 ovos", "1 xícara de açúcar", "1 xícara de farinha de trigo", "1/2 xícara de nozes moídas", "1 colher (chá) de fermento", "300 g de doce de leite", "300 ml de creme de leite fresco", "2 colheres (sopa) de açúcar de confeiteiro"], "steps": ["Bata os ovos com o açúcar por 10 minutos, até triplicar de volume.", "Misture a farinha, as nozes e o fermento, e incorpore delicadamente.", "Asse em forma de 20 cm a 180 °C por 30 a 35 minutos. Esfrie e corte em 2 camadas.", "Bata o creme de leite com o açúcar de confeiteiro para fazer o chantilly.", "Recheie com doce de leite, cubra com chantilly e decore com nozes."], "dica": "Não abra o forno nos primeiros 20 minutos, ou o bolo murcha."}, {"id": "d07", "title": "Torta de Marzipã e Chocolate", "rende": "10 fatias", "tempo": "1h30 (mais 3 horas de geladeira)", "dif": "Média", "hist": "Amêndoa e chocolate são uma dupla clássica. Aqui o creme de amêndoa é coberto por ganache e um desenho de cacau.", "ing": ["1 massa sablée (receita 5.1)", "Creme de amêndoa da sobremesa 3 deste bônus (120 g de manteiga, 120 g de açúcar, 2 ovos, 150 g de amêndoas moídas, 30 g de farinha)", "200 g de chocolate meio amargo", "200 ml de creme de leite fresco", "Cacau em pó para decorar"], "steps": ["Prepare a base e o creme de amêndoa como na sobremesa 3 deste bônus e asse por 30 a 35 minutos. Esfrie.", "Faça a ganache: aqueça o creme de leite, despeje sobre o chocolate picado, espere 1 minuto e mexa.", "Cubra a torta com a ganache morna e leve à geladeira por 3 horas.", "Coloque tiras de papel em xadrez sobre a torta e peneire o cacau. Retire o papel."], "dica": "A torta fica mais bonita se a ganache estiver morna ao ser despejada, e não quente."}, {"id": "d08", "title": "Cocada Cremosa com Baba de Moça", "rende": "12 porções", "tempo": "1 hora", "dif": "Fácil", "hist": "A cocada e a baba de moça são doces de herança portuguesa e muito presentes nas mesas brasileiras.", "ing": ["400 g de coco ralado", "1 lata de leite condensado", "200 ml de leite de coco", "3 ovos", "100 g de açúcar", "Para a baba de moça: 1 xícara de açúcar, 1/2 xícara de água, 200 ml de leite de coco, 6 gemas", "Lascas de coco tostadas"], "steps": ["Misture o coco, o leite condensado, o leite de coco, os ovos e o açúcar.", "Despeje em travessa untada e asse a 180 °C por 35 a 40 minutos, até dourar.", "Baba de moça: ferva o açúcar com a água por 5 minutos e junte o leite de coco.", "Adicione as gemas peneiradas, em fogo baixo, mexendo até engrossar.", "Despeje a baba sobre a cocada e finalize com lascas de coco."], "dica": "Esfrie a cocada antes de cobrir com a baba, para não derreter."}, {"id": "d09", "title": "Rabanada de Forno", "rende": "12 fatias", "tempo": "50 minutos", "dif": "Fácil", "hist": "A rabanada é um doce natalino de origem portuguesa. Assada no forno, fica mais leve e prática.", "ing": ["12 fatias de pão francês ou brioche", "400 ml de leite", "1 lata de leite condensado", "3 ovos", "Açúcar e canela para polvilhar", "Manteiga para untar"], "steps": ["Misture o leite e o leite condensado.", "Passe as fatias de pão na mistura, sem deixar encharcar.", "Passe nos ovos batidos e coloque em assadeira untada.", "Asse a 200 °C por 15 minutos de cada lado, até dourar.", "Passe na mistura de açúcar e canela ainda quente."], "dica": "Use pão amanhecido: absorve melhor sem desmanchar."}, {"id": "d10", "title": "Taça de Panetone", "rende": "10 taças", "tempo": "40 minutos (mais 3 horas de geladeira)", "dif": "Fácil", "hist": "O panetone é o doce símbolo do Natal. Em taça, ele vira pavê com creme e frutas.", "ing": ["500 g de panetone em cubos", "500 ml de leite", "1 lata de leite condensado", "3 gemas", "2 colheres (sopa) de amido de milho", "300 ml de creme de leite fresco", "Chocolate ralado ou frutas para decorar"], "steps": ["Leve o leite, o leite condensado, as gemas e o amido ao fogo baixo, mexendo, até virar um creme espesso. Esfrie.", "Bata o creme de leite fresco em chantilly e misture ao creme frio.", "Em cada taça, alterne cubos de panetone e creme.", "Leve à geladeira por 3 horas.", "Decore com chocolate ou frutas."], "dica": "Se o panetone estiver muito seco, regue os cubos com um pouco de leite."}]}, {"id": "b5", "ico": "📅", "name": "Planejador da Ceia Perfeita", "sub": "Cronograma, quantidades e checklist", "intro": "Organize a ceia sem correria. Marque cada tarefa conforme avança. Os horários são uma sugestão para uma ceia às 21h, então ajuste ao seu.", "blocks": [{"h": "14 dias antes", "ck": ["Defina o número de convidados e confirme a presença", "Escolha o cardápio (use os cardápios prontos da introdução)", "Pergunte sobre alergias e restrições", "Encomende peru, bacalhau e peças especiais", "Teste uma receita nova"]}, {"h": "7 dias antes", "ck": ["Compre os itens que não estragam: arroz, farinhas, castanhas, bebidas", "Faça os mixed nuts (receita 2.4)", "Confira se tem travessas, panelas e formas suficientes", "Compre termômetro de cozinha, se não tiver"]}, {"h": "3 dias antes", "ck": ["Compre frutas, folhas e laticínios", "Organize a geladeira e o freezer", "Lave e passe toalhas e guardanapos", "Faça os suspiros (receita 5.2)"]}, {"h": "2 dias antes", "ck": ["Passe o peru congelado para a geladeira", "Dessalgue o bacalhau, trocando a água várias vezes por dia", "Faça as massas de torta"]}, {"h": "1 dia antes (véspera)", "ck": ["Tempere o peru ou o pernil", "Faça as sobremesas que precisam gelar (pudim, torta mousse, mil-folhas)", "Prepare compota, farofas e molhos", "Monte a mesa, só sem os alimentos", "Deixe bebidas na geladeira"]}, {"h": "Dia da ceia: horários sugeridos", "ol": ["15h30: tire o peru da geladeira e lave e seque as folhas das saladas.", "16h30: preaqueça o forno a 180 °C e leve o peru ao forno.", "18h: faça farofa, compota e molho. Monte a tábua e deixe coberta na geladeira.", "19h30: retire o peru, cubra com alumínio e deixe descansar. Cozinhe os arrozes.", "20h: monte as saladas (sem molho) e aqueça os acompanhamentos.", "20h30: sirva a tábua e as entradas, enquanto os convidados chegam. Fatie o peru.", "21h: tempere as saladas, monte as travessas e sirva a ceia."]}, {"h": "Quantidades por convidado (referência)", "p": "Estes números são uma média para um cardápio com várias opções. Para carnes com osso, aumente cerca de 30%.", "table": {"head": ["Convidados", "Carne", "Arroz cru", "Saladas", "Sobremesas", "Bebidas"], "rows": [["6", "1,8 kg", "420 g", "0,6 kg", "720 g", "7 L"], ["10", "3 kg", "700 g", "1 kg", "1,2 kg", "12 L"], ["14", "4,2 kg", "980 g", "1,4 kg", "1,7 kg", "17 L"], ["20", "6 kg", "1,4 kg", "2 kg", "2,4 kg", "24 L"]]}}, {"h": "Checklist da cozinha", "ck": ["Termômetro de cozinha", "Papel-alumínio e filme", "Travessas e utensílios de servir", "Potes para as sobras", "Gelo e espaço na geladeira", "Lixo extra e panos limpos"]}]}], "intro": "<h2>BOAS-VINDAS</h2><p>Parabéns por abrir este dossiê.</p><p>Você acabou de dar o primeiro passo para uma ceia que a sua família vai lembrar com carinho. Não é um livro de receitas comum. É um <strong>mapa de sabor</strong>: 25 combinações precisas, com o modo de preparo exato, para que você não tenha erro.</p><p>É a diferença entre “fazer comida” e “criar uma experiência”.</p><p>Aqui você não vai encontrar receitas soltas. Cada prato foi pensado para <strong>combinar com os outros</strong>. Por isso, em cada receita você vai ver um campo chamado <strong>Combinação Secreta</strong>: ele diz exatamente o que servir ao lado para a mesa ficar equilibrada, bonita e saborosa.</p><h2>COMO FUNCIONA O MAPA DE SABOR</h2><p>Toda receita segue a mesma jornada, sempre na mesma ordem:</p><ol><li><strong>ESCOLHER:</strong> abra o sumário e escolha os pratos que combinam com a sua família.</li><li><strong>COMPRAR:</strong> use a lista de compras de cada receita e marque o que já tem em casa.</li><li><strong>PREPARAR:</strong> siga o modo de preparo passo a passo, na ordem em que está escrito.</li><li><strong>SERVIR:</strong> veja a dica de apresentação e a combinação secreta para montar a mesa.</li></ol><h2>COMO LER CADA RECEITA</h2><p>Todas as receitas têm exatamente a mesma estrutura:</p><ul><li><strong>Rende, Tempo, Dificuldade:</strong> para você planejar antes de começar.</li><li><strong>Um pouco da história:</strong> a origem do prato, em poucas linhas.</li><li><strong>Lista de compras:</strong> todos os ingredientes, com quantidades, separados por grupo.</li><li><strong>Modo de preparo:</strong> passos numerados, na ordem certa.</li><li><strong>Dica de ouro:</strong> o detalhe que evita o erro mais comum.</li><li><strong>Combinação secreta:</strong> o que servir junto com este prato.</li><li><strong>Na mesa e pode adiantar?:</strong> como apresentar e o que dá para fazer antes.</li></ul><h2>ANTES DE COMEÇAR (leia com atenção)</h2><p><strong>Fornos são diferentes.</strong> Os tempos e as temperaturas deste dossiê são uma referência. Cada forno esquenta de um jeito, então confie também nos sinais descritos em cada passo (cor, textura, cheiro).</p><p><strong>Use um termômetro de cozinha.</strong> Ele é o jeito mais seguro de saber se aves, carnes e peixes estão no ponto, sem secar nem ficar crus. É barato e vale o investimento.</p><p><strong>Segurança dos alimentos:</strong></p><ul><li>Descongele carnes e aves sempre na geladeira, nunca na bancada.</li><li>Use tábuas e facas separadas para carne crua e para alimentos que serão servidos crus.</li><li>Não deixe pratos quentes ou frios por mais de 2 horas fora de temperatura adequada.</li><li>Preparos com peixe cru (como o tartar) devem usar peixe fresco, de procedência confiável, mantido gelado e consumido no mesmo dia. Gestantes, crianças pequenas, idosos e pessoas com imunidade baixa devem evitar alimentos crus ou malcozidos.</li></ul><p><strong>Alergias e restrições.</strong> Várias receitas levam castanhas, frutos do mar, leite, ovos, glúten e álcool. Pergunte aos seus convidados antes de decidir o cardápio e avise quem for comer.</p><p><strong>Quantidades.</strong> Cada receita informa para quantas porções rende. Para ajustar, multiplique ou divida os ingredientes, mas lembre que o tempo de forno muda com o tamanho da peça.</p><p><strong>Teste antes.</strong> Se puder, faça uma ou duas receitas antes do Natal. Assim você se sente seguro no dia e já sabe como o seu forno se comporta.</p><h2>COMO MONTAR SUA CEIA (cardápios prontos)</h2><p>Se você não quer pensar muito, escolha um dos cardápios abaixo. Eles já usam as combinações secretas.</p><h3>Ceia Clássica Elegante (8 a 10 pessoas)</h3><ul><li>Entrada: <a class=\"x\" href=\"#r07\">2.1</a> Brie Folhado com Farofa de Pistache e Mel</li><li>Principal: <a class=\"x\" href=\"#r01\">1.1</a> Peru Assado com Compota de Frutas Secas</li><li>Acompanhamentos: <a class=\"x\" href=\"#r12\">3.1</a> Arroz com Amêndoas e <a class=\"x\" href=\"#r18\">4.2</a> Salada de Figos com Presunto Cru</li><li>Sobremesa: <a class=\"x\" href=\"#r21\">5.1</a> Torta de Limão com Merengue</li></ul><h3>Ceia do Mar (8 a 10 pessoas)</h3><ul><li>Entrada: <a class=\"x\" href=\"#r09\">2.3</a> Coquetel de Camarão com Molho Cremoso de Ervas</li><li>Principal: <a class=\"x\" href=\"#r04\">1.4</a> Salmão com Crosta de Pistache e Molho de Açafrão</li><li>Acompanhamentos: <a class=\"x\" href=\"#r16\">3.5</a> Cuscuz de Camarão e <a class=\"x\" href=\"#r17\">4.1</a> Salada Caprese Especial</li><li>Sobremesa: <a class=\"x\" href=\"#r22\">5.2</a> Merengue de Morango em Taça</li></ul><h3>Ceia Brasileira de Festa (10 a 12 pessoas)</h3><ul><li>Entrada: <a class=\"x\" href=\"#r11\">2.5</a> Tábua de Natal</li><li>Principal: <a class=\"x\" href=\"#r02\">1.2</a> Pernil de Porco Assado Lentamente e <a class=\"x\" href=\"#r05\">1.5</a> Bacalhoada Tradicional</li><li>Acompanhamentos: <a class=\"x\" href=\"#r14\">3.3</a> Arroz de Pato e <a class=\"x\" href=\"#r20\">4.4</a> Salada de Grãos</li><li>Sobremesa: <a class=\"x\" href=\"#r25\">5.5</a> Mil-Folhas de Doce de Leite</li></ul><h3>Ceia Sofisticada para Poucos (4 a 6 pessoas)</h3><ul><li>Entrada: <a class=\"x\" href=\"#r08\">2.2</a> Tartar de Atum com Vinagrete de Abacate</li><li>Principal: <a class=\"x\" href=\"#r03\">1.3</a> Roast Beef de Filé Mignon com Legumes</li><li>Acompanhamentos: <a class=\"x\" href=\"#r15\">3.4</a> Nhoque de Mandioquinha e <a class=\"x\" href=\"#r19\">4.3</a> Belle Salade</li><li>Sobremesa: <a class=\"x\" href=\"#r24\">5.4</a> Torta Mousse de Chocolate Belga</li></ul>", "mods": [{"n": 1, "name": "Pratos Principais", "sub": "O centro da sua ceia. Carnes, aves e peixes que fazem a mesa parar para olhar.", "recs": [{"id": "r01", "num": "1.1", "title": "Peru Assado com Compota de Frutas Secas e Farofa Rústica", "rende": "10 a 12 porções", "tempo": "4 horas (mais 2 dias para descongelar)", "dif": "Média", "hist": "O peru assado é um dos símbolos da ceia de Natal brasileira, herdado de tradições europeias e norte-americanas e adaptado ao nosso jeito, com farofa, frutas secas e muito tempero. Nesta versão, a compota doce-azedinha faz o contraponto perfeito com a carne.", "groups": [{"g": "O peru", "items": ["1 peru de 5 a 6 kg, descongelado", "3 colheres (sopa) de sal grosso", "1 colher (chá) de pimenta-do-reino moída"]}, {"g": "Tempero de manteiga", "items": ["150 g de manteiga em temperatura ambiente", "6 dentes de alho amassados", "2 colheres (sopa) de folhas de tomilho", "1 colher (sopa) de alecrim picado", "Raspas de 2 laranjas"]}, {"g": "Para dentro do peru e da assadeira", "items": ["2 laranjas cortadas em quartos", "1 cebola grande em quartos", "3 ramos de alecrim", "500 ml de caldo de galinha", "1 xícara de vinho branco seco"]}, {"g": "Compota de frutas secas", "items": ["150 g de damascos secos", "150 g de ameixas pretas sem caroço", "100 g de uvas-passas", "Suco de 2 laranjas", "1 pau de canela", "2 colheres (sopa) de açúcar mascavo", "1 colher (sopa) de manteiga"]}, {"g": "Farofa rústica", "items": ["100 g de manteiga", "100 g de bacon em cubinhos", "1 cebola picada", "3 xícaras (360 g) de farinha de mandioca torrada", "1/2 xícara de castanhas picadas", "1/2 xícara de salsinha picada"]}, {"g": "Molho", "items": ["1 colher (sopa) de amido de milho dissolvido em 3 colheres (sopa) de água fria"]}], "steps": ["<strong>Descongele com antecedência.</strong> Deixe o peru na geladeira por cerca de 2 dias, dentro de uma assadeira, para não vazar líquido nos outros alimentos.", "<strong>Tempere na véspera (recomendado).</strong> Esfregue o sal grosso e a pimenta por toda a ave. Deixe na geladeira, descoberto, por 12 a 24 horas. A pele fica mais seca e dourada.", "<strong>No dia, tire da geladeira 1 hora antes</strong> de assar. Preaqueça o forno a 180 °C.", "<strong>Faça o tempero de manteiga:</strong> misture a manteiga, o alho, o tomilho, o alecrim e as raspas de laranja. Com cuidado, afaste a pele do peito e passe metade da manteiga por baixo dela. Passe o resto por fora.", "<strong>Recheie a cavidade só com aromáticos:</strong> laranja, cebola e alecrim. Não coloque farofa dentro da ave, para garantir que o peru asse por igual.", "<strong>Amarre as pernas</strong> com barbante de cozinha e dobre as pontas das asas para baixo.", "<strong>Monte a assadeira:</strong> coloque o peru com o peito para cima, despeje o caldo e o vinho no fundo e cubra com papel-alumínio.", "<strong>Asse por cerca de 2h45 a 3h15</strong> (para 5 a 6 kg). A cada 40 minutos, regue com o líquido do fundo. Nos últimos 40 minutos, retire o papel para dourar.", "<strong>Confirme o ponto:</strong> o termômetro na parte mais grossa da coxa, sem encostar no osso, deve marcar 74 °C, e o suco que escorre deve estar claro.", "<strong>Descanse 30 minutos</strong>, coberto com papel-alumínio. Esse descanso deixa a carne suculenta.", "<strong>Faça a compota:</strong> leve as frutas, o suco, a canela e o açúcar ao fogo baixo por 15 minutos, até ficar macio e brilhante. Finalize com a manteiga.", "<strong>Faça a farofa:</strong> derreta a manteiga, frite o bacon, acrescente a cebola e refogue. Junte a farinha, as castanhas e a salsinha, mexendo por 3 minutos. Acerte o sal.", "<strong>Faça o molho:</strong> coe o líquido da assadeira, retire o excesso de gordura, leve ao fogo por 10 minutos e engrosse com o amido dissolvido.", "<strong>Fatie:</strong> retire cada metade do peito inteira e corte em fatias, sempre contra as fibras."], "dica": "Não confie só no relógio. Peru de tamanhos diferentes assa em tempos diferentes. O termômetro é o que garante uma carne segura e macia.", "combina": "<a class=\"x\" href=\"#r12\">3.1</a> Arroz com Amêndoas, <a class=\"x\" href=\"#r13\">3.2</a> Arroz Byriani de Ervas e <a class=\"x\" href=\"#r18\">4.2</a> Salada de Figos com Presunto Cru e Nozes.", "mesa": "monte as fatias em leque na travessa, com a compota de um lado e a farofa do outro. Um laço vermelho de tecido e ramos de alecrim fazem a foto.", "pode": "compota e farofa podem ser feitas 1 dia antes. O tempero de manteiga também."}, {"id": "r02", "num": "1.2", "title": "Pernil de Porco Assado Lentamente com Farofa de Ameixa", "rende": "10 a 12 porções", "tempo": "6 horas (mais 12 horas de marinada)", "dif": "Fácil", "hist": "Assar peças de porco lentamente é uma tradição de várias cozinhas do mundo, e no Brasil o pernil ganhou lugar cativo na ceia porque rende bem, é macio e perfuma a casa inteira.", "groups": [{"g": "O pernil", "items": ["1 pernil de porco com osso de cerca de 4 kg", "2 colheres (sopa) de sal grosso"]}, {"g": "Marinada", "items": ["10 dentes de alho amassados", "Suco de 3 limões", "1 xícara de vinho branco seco", "3 colheres (sopa) de mostarda", "3 colheres (sopa) de azeite", "1 colher (sopa) de alecrim picado", "1 colher (sopa) de tomilho", "1 colher (chá) de pimenta-do-reino"]}, {"g": "Para assar", "items": ["2 cebolas em rodelas grossas", "1 xícara de caldo de legumes ou água", "2 colheres (sopa) de mel"]}, {"g": "Farofa de ameixa", "items": ["80 g de manteiga", "1 cebola picada", "100 g de bacon em cubinhos", "12 ameixas pretas sem caroço, picadas", "3 xícaras (360 g) de farinha de mandioca torrada", "1/2 xícara de salsinha picada"]}], "steps": ["<strong>Faça pequenos cortes</strong> na pele e na gordura do pernil, em formato de losango, sem chegar na carne. Isso ajuda o tempero a entrar e a pele a ficar crocante.", "<strong>Misture a marinada</strong> (alho, limão, vinho, mostarda, azeite, ervas e pimenta) e esfregue bem no pernil, inclusive dentro dos cortes. Salgue com o sal grosso.", "<strong>Deixe marinar</strong> na geladeira, coberto, por 12 horas, virando uma vez.", "<strong>Tire da geladeira 1 hora antes</strong> de assar. Preaqueça o forno a 160 °C.", "<strong>Monte a assadeira:</strong> forre com as cebolas, coloque o pernil por cima, adicione o caldo e cubra bem com papel-alumínio.", "<strong>Asse coberto por cerca de 3h30 a 4h.</strong> A carne deve estar macia ao garfo e o termômetro, no centro, acima de 75 °C.", "<strong>Doure:</strong> retire o papel, pincele o mel, aumente o forno para 220 °C e asse por 20 a 30 minutos, até a pele ficar dourada e crocante.", "<strong>Descanse 20 minutos</strong> antes de fatiar.", "<strong>Molho:</strong> coe o caldo da assadeira, tire o excesso de gordura e ferva por 10 minutos para apurar.", "<strong>Farofa:</strong> derreta a manteiga, frite o bacon, junte a cebola e a ameixa. Acrescente a farinha e a salsinha e mexa por 3 minutos."], "dica": "Se a pele não ficar crocante no passo 7, ligue só a resistência superior por mais alguns minutos, vigiando o tempo todo para não queimar.", "combina": "<a class=\"x\" href=\"#r12\">3.1</a> Arroz com Amêndoas, <a class=\"x\" href=\"#r20\">4.4</a> Salada de Grãos Tradicional e <a class=\"x\" href=\"#r21\">5.1</a> Torta de Limão.", "mesa": "sirva o pernil inteiro, com uma parte já fatiada, apoiado sobre a farofa. Fatias de laranja e ramos de alecrim por volta.", "pode": "a marinada deve ser feita na véspera. A farofa pode ser feita 1 dia antes e aquecida na frigideira."}, {"id": "r03", "num": "1.3", "title": "Roast Beef de Filé Mignon com Legumes Assados e Molho", "rende": "8 porções", "tempo": "1h30", "dif": "Média", "hist": "O roast beef é um clássico da culinária inglesa, associado a refeições de domingo e celebrações. Aqui ele ganha filé mignon e uma travessa de legumes brasileiros: abóbora, batata-doce e palmito.", "groups": [{"g": "A carne", "items": ["1,5 kg de filé mignon em peça inteira, limpo", "2 colheres (chá) de sal grosso", "1 colher (chá) de pimenta-do-reino", "3 colheres (sopa) de azeite", "2 colheres (sopa) de mostarda Dijon", "4 ramos de alecrim"]}, {"g": "Legumes assados", "items": ["500 g de abóbora cabotiá em cubos", "400 g de batata-doce roxa em rodelas grossas", "300 g de palmito pupunha em tiras", "3 colheres (sopa) de azeite", "Sal e tomilho a gosto"]}, {"g": "Molho", "items": ["1 cebola pequena picada", "1 xícara de vinho tinto seco", "500 ml de caldo de carne", "1 colher (sopa) de manteiga gelada"]}], "steps": ["<strong>Tire a carne da geladeira 1 hora antes</strong> e seque bem com papel-toalha. Preaqueça o forno a 200 °C.", "<strong>Tempere</strong> com sal, pimenta e metade do azeite. Amarre a peça com barbante a cada 3 cm, para manter o formato.", "<strong>Sele a carne</strong> em frigideira muito quente com o resto do azeite, 2 minutos de cada lado, até dourar por todos os lados. Guarde a frigideira, sem lavar, para o molho.", "<strong>Pincele a mostarda</strong> e coloque os ramos de alecrim por cima.", "<strong>Asse os legumes</strong> em uma assadeira, com azeite, sal e tomilho, por cerca de 35 minutos, virando uma vez.", "<strong>Asse a carne</strong> por 20 a 25 minutos, até o termômetro marcar 52 a 55 °C no centro (ao ponto para mal passado). Para ao ponto, retire com 58 a 60 °C.", "<strong>Descanse a carne 15 minutos</strong>, coberta com papel-alumínio. A temperatura sobe cerca de 3 °C durante o descanso.", "<strong>Molho:</strong> na frigideira da carne, refogue a cebola, junte o vinho e deixe reduzir pela metade. Adicione o caldo e ferva por 10 minutos. Fora do fogo, bata a manteiga gelada para dar brilho.", "<strong>Fatie</strong> a carne em fatias de 1 cm e monte na travessa com os legumes."], "dica": "Se algum convidado quiser a carne mais passada, coloque a fatia por 1 minuto no molho quente, em vez de assar a peça inteira por mais tempo.", "combina": "<a class=\"x\" href=\"#r15\">3.4</a> Nhoque de Mandioquinha, <a class=\"x\" href=\"#r19\">4.3</a> Belle Salade e <a class=\"x\" href=\"#r24\">5.4</a> Torta Mousse de Chocolate Belga.", "mesa": "fatias sobrepostas em fila, legumes nas laterais, folhinhas de alecrim e o molho em uma molheira.", "pode": "os legumes podem ser assados 2 horas antes e reaquecidos. O molho pode ser feito 1 dia antes, sem a manteiga final."}, {"id": "r04", "num": "1.4", "title": "Salmão com Crosta de Pistache e Molho de Açafrão", "rende": "8 porções", "tempo": "1 hora", "dif": "Média", "hist": "Nas ceias brasileiras, os peixes ganharam espaço como uma opção mais leve que as carnes tradicionais. A crosta de pistache traz crocância e cor de festa, e o açafrão deixa o molho dourado.", "groups": [{"g": "O salmão", "items": ["1,2 a 1,5 kg de lombo de salmão em peça única, sem espinhas", "2 colheres (sopa) de azeite", "Sal e pimenta-do-reino a gosto"]}, {"g": "Crosta de pistache", "items": ["150 g de pistache sem casca, moído grosso", "50 g de farinha panko ou farinha de rosca", "60 g de manteiga derretida", "2 colheres (sopa) de mostarda Dijon", "Raspas de 1 limão", "1 colher (sopa) de salsinha picada"]}, {"g": "Molho de açafrão", "items": ["1 chalota ou 1/2 cebola pequena picada", "1 colher (sopa) de manteiga", "100 ml de vinho branco seco", "1 pitada de açafrão (ou 1/2 colher de chá de cúrcuma, se não encontrar)", "300 ml de creme de leite fresco", "Sal e suco de limão a gosto"]}], "steps": ["<strong>Tire o salmão da geladeira 20 minutos antes</strong> e seque com papel-toalha. Preaqueça o forno a 160 °C.", "<strong>Tempere</strong> com sal, pimenta e azeite. Coloque sobre papel-manteiga em uma assadeira.", "<strong>Asse por 15 minutos</strong>, só para começar o cozimento em fogo baixo.", "<strong>Faça a crosta:</strong> misture o pistache, o panko, a manteiga, as raspas de limão e a salsinha, até virar uma farofa úmida.", "<strong>Retire o salmão do forno</strong>, pincele a mostarda por cima e cubra com a crosta, pressionando com as mãos.", "<strong>Volte ao forno por 10 a 15 minutos</strong>, até o centro marcar 55 a 58 °C e a crosta ficar dourada. Quem prefere mais passado pode deixar chegar a 63 °C.", "<strong>Molho:</strong> refogue a chalota na manteiga, junte o vinho e reduza pela metade. Dissolva o açafrão em 2 colheres de água quente e acrescente. Adicione o creme e cozinhe em fogo baixo por 8 minutos, até encorpar. Acerte o sal e finalize com algumas gotas de limão.", "<strong>Descanse o salmão 5 minutos</strong> antes de cortar em porções."], "dica": "Salmão seca rápido. Retire do forno quando ainda estiver levemente rosado no centro: o calor residual termina o cozimento.", "combina": "<a class=\"x\" href=\"#r13\">3.2</a> Arroz Byriani de Ervas, <a class=\"x\" href=\"#r17\">4.1</a> Salada Caprese Especial e <a class=\"x\" href=\"#r09\">2.3</a> Coquetel de Camarão.", "mesa": "apresente a peça inteira numa travessa comprida, com o molho ao lado e rodelas de limão.", "pode": "a crosta pode ser misturada de manhã e guardada na geladeira. O molho, 1 dia antes (reaqueça em fogo baixo)."}, {"id": "r05", "num": "1.5", "title": "Bacalhoada Tradicional", "rende": "8 a 10 porções", "tempo": "1h30 (mais 48 horas de dessalga)", "dif": "Fácil", "hist": "O bacalhau chegou à mesa brasileira pela herança portuguesa e é muito associado à ceia de Natal em muitas famílias, principalmente na véspera. A bacalhoada junta tudo o que dá cor e sabor: batata, ovo, azeitona, tomate e o alho frito por cima.", "groups": [{"g": "Bacalhau e base", "items": ["1 kg de lombo de bacalhau salgado (dessalgado)", "1 kg de batatas", "6 ovos", "1 xícara de azeitonas pretas"]}, {"g": "Legumes", "items": ["3 cebolas em rodelas", "4 tomates maduros em fatias", "1 pimentão verde e 1 vermelho em tiras", "1/2 maço de salsinha picada"]}, {"g": "Azeite com alho", "items": ["1 xícara de azeite extravirgem", "8 dentes de alho em lâminas finas", "Pimenta-do-reino a gosto"]}], "steps": ["<strong>Dessalgue o bacalhau</strong> por 48 horas na geladeira, em água fria, trocando a água 4 a 5 vezes por dia. Prove um pedacinho: se estiver pouco salgado, está pronto.", "<strong>Cozinhe as batatas</strong> com casca, em água com sal, por cerca de 25 minutos. Descasque e corte em rodelas.", "<strong>Cozinhe os ovos</strong> por 10 minutos, esfrie em água gelada e corte em fatias.", "<strong>Cozinhe o bacalhau:</strong> coloque em água fria, leve ao fogo e retire assim que começar a ferver. Desligue, tampe e deixe 8 minutos. Escorra, retire pele e espinhas e faça lascas grandes.", "<strong>Refogue</strong> as cebolas e os pimentões em um pouco de azeite por 5 minutos, até murcharem.", "<strong>Monte em uma travessa:</strong> camada de batata, bacalhau, tomate, cebola e pimentão, ovos e azeitonas. Repita.", "<strong>Alho dourado:</strong> aqueça o azeite em fogo baixo, junte o alho e retire do fogo quando ficar levemente dourado. Não deixe queimar, para não amargar.", "<strong>Regue</strong> a bacalhoada com o azeite e o alho. Finalize com salsinha e pimenta."], "dica": "A dessalga é a etapa mais importante. Se o bacalhau ficar muito salgado, o prato inteiro perde. Prove antes de cozinhar.", "combina": "<a class=\"x\" href=\"#r12\">3.1</a> Arroz com Amêndoas, <a class=\"x\" href=\"#r20\">4.4</a> Salada de Grãos Tradicional e <a class=\"x\" href=\"#r25\">5.5</a> Mil-Folhas de Doce de Leite.", "mesa": "sirva na travessa em que foi montada, com um fio extra de azeite e ovos em destaque.", "pode": "dessalgue e cozinhe o bacalhau 1 dia antes. Monte a travessa na hora de servir."}, {"id": "r06", "num": "1.6", "title": "Lasanha com Ragu de Ossobuco e Bechamel", "rende": "10 porções", "tempo": "4 horas", "dif": "Difícil", "hist": "A lasanha é um clássico da Itália, muito ligada às mesas de família, e ganhou lugar cativo nas festas brasileiras. O ragu de ossobuco é uma releitura inspirada no ossobuco milanês, cozido devagar até a carne desmanchar.", "groups": [{"g": "Ragu de ossobuco", "items": ["1,2 kg de ossobuco (com osso)", "3 colheres (sopa) de azeite", "1 cebola grande picada", "2 cenouras picadas", "2 talos de aipo picados", "4 dentes de alho", "1 xícara de vinho tinto seco", "800 g de tomates pelados (2 latas)", "500 ml de caldo de carne", "2 folhas de louro e 1 ramo de tomilho", "Sal e pimenta-do-reino a gosto"]}, {"g": "Bechamel", "items": ["80 g de manteiga", "80 g de farinha de trigo", "1,2 litro de leite morno", "1 pitada de noz-moscada", "Sal a gosto"]}, {"g": "Montagem", "items": ["500 g de massa de lasanha (pré-cozida ou seca)", "100 g de queijo parmesão ralado", "300 g de mussarela em fatias", "Manteiga para untar"]}], "steps": ["<strong>Sele o ossobuco:</strong> tempere com sal e pimenta, doure em fogo alto no azeite, dos dois lados. Reserve.", "<strong>Refogue</strong> na mesma panela a cebola, a cenoura e o aipo por 8 minutos. Junte o alho.", "<strong>Deglaceie</strong> com o vinho e deixe reduzir pela metade.", "<strong>Cozinhe o ragu:</strong> volte a carne, adicione os tomates amassados, o caldo, o louro e o tomilho. Tampe e cozinhe em fogo baixo por 2h30 a 3 horas, até a carne soltar do osso.", "<strong>Desfie a carne</strong> com dois garfos, descartando ossos e o tutano em excesso, e devolva ao molho. Reduza até ficar encorpado.", "<strong>Bechamel:</strong> derreta a manteiga, junte a farinha e mexa por 2 minutos. Adicione o leite aos poucos, mexendo sempre, até engrossar. Tempere com sal e noz-moscada.", "<strong>Pré-aqueça o forno a 200 °C</strong> e unte uma travessa grande (cerca de 30 x 40 cm).", "<strong>Monte:</strong> molho de ragu, massa, bechamel, ragu, mussarela, parmesão. Repita 4 camadas, terminando com bechamel e queijo.", "<strong>Asse coberto com papel-alumínio por 20 minutos</strong>, depois sem o papel por 20 minutos, até gratinar.", "<strong>Descanse 15 minutos</strong> antes de cortar, para as camadas assentarem."], "dica": "Se a massa for pré-cozida, o molho precisa estar mais líquido para hidratá-la. Se for seca, cozinhe antes conforme a embalagem.", "combina": "<a class=\"x\" href=\"#r17\">4.1</a> Salada Caprese Especial, <a class=\"x\" href=\"#r19\">4.3</a> Belle Salade e <a class=\"x\" href=\"#r22\">5.2</a> Merengue de Morango em Taça.", "mesa": "sirva na própria travessa, com salsinha fresca picada por cima.", "pode": "o ragu e o bechamel podem ser feitos 1 dia antes. Monte e asse no dia."}]}, {"n": 2, "name": "Entradas e Petiscos", "sub": "O primeiro impacto da noite. Pratos que chegam antes do jantar e já criam o clima de festa.", "recs": [{"id": "r07", "num": "2.1", "title": "Brie Folhado com Farofa de Pistache e Mel", "rende": "8 a 10 porções (como entrada)", "tempo": "50 minutos", "dif": "Fácil", "hist": "O brie é um queijo francês de casca macia. Envolvê-lo em massa folhada e assar é um clássico das festas e dos coquetéis, famoso por aquele corte que deixa o queijo escorrer. A farofa de pistache e o mel dão o toque brasileiro de ceia.", "groups": [{"g": "Brie folhado", "items": ["1 roda de queijo brie de 500 g", "2 placas de massa folhada (cerca de 500 g), descongeladas", "1 gema + 1 colher (sopa) de leite (para pincelar)", "1 colher (sopa) de geleia de damasco ou frutas vermelhas (opcional, por baixo do queijo)"]}, {"g": "Farofa de pistache", "items": ["80 g de pistache sem casca, picado fino", "3 colheres (sopa) de farinha panko", "2 colheres (sopa) de manteiga derretida"]}, {"g": "Para finalizar", "items": ["3 colheres (sopa) de mel", "1 colher (chá) de azeite trufado (opcional)", "Pão baguete em fatias ou torradas, para servir"]}], "steps": ["<strong>Tire o queijo da geladeira</strong> 30 minutos antes. Preaqueça o forno a 200 °C.", "<strong>Abra uma placa de massa</strong> em superfície enfarinhada e coloque o brie no centro. Se quiser, espalhe a geleia sobre o queijo.", "<strong>Cubra com a segunda placa</strong>, que deve ser maior que a roda. Aperte as bordas por baixo do queijo e corte o excesso de massa, deixando uma borda de 2 cm.", "<strong>Decore</strong> com tiras ou estrelas feitas com as sobras da massa.", "<strong>Pincele</strong> com a gema misturada ao leite e leve à geladeira por 20 minutos. A massa gelada cresce melhor.", "<strong>Asse por 25 a 30 minutos</strong>, até dourar bem e crescer.", "<strong>Farofa:</strong> misture o pistache, o panko e a manteiga, e toste em frigideira por 3 minutos, mexendo.", "<strong>Descanse o brie 10 minutos.</strong> Enquanto isso, misture o mel com o azeite trufado, se for usar.", "<strong>Finalize</strong> com a farofa por cima e ao redor, e regue com o mel."], "dica": "Descanse sempre 10 minutos antes de cortar. Se cortar logo ao sair do forno, o queijo escorre todo e a massa fica encharcada.", "combina": "<a class=\"x\" href=\"#r10\">2.4</a> Mixed Nuts Spicy, <a class=\"x\" href=\"#r18\">4.2</a> Salada de Figos e uma taça de espumante bem gelado.", "mesa": "coloque a roda em uma bandeja dourada, com a farofa espalhada ao redor e a baguete cortada ao lado.", "pode": "monte o folhado de manhã e guarde na geladeira. Asse na hora, 1 hora antes dos convidados."}, {"id": "r08", "num": "2.2", "title": "Tartar de Atum com Vinagrete de Abacate", "rende": "8 porções", "tempo": "30 minutos", "dif": "Fácil", "hist": "O tartar nasceu como um preparo de carne crua picada. As versões com atum fresco são releituras modernas, leves e elegantes, perfeitas para o brinde antes do jantar. Aqui, o abacate cremoso faz as camadas da taça.", "groups": [{"g": "Atum", "items": ["400 g de atum fresco, qualidade para consumo cru", "1 colher (sopa) de shoyu", "1 colher (chá) de óleo de gergelim", "Suco de 1/2 limão", "1 colher (chá) de gengibre ralado", "2 colheres (sopa) de cebolinha picada"]}, {"g": "Vinagrete de abacate", "items": ["2 abacates maduros em cubinhos", "1/2 cebola roxa picada fino", "1 tomate sem sementes em cubinhos", "Suco de 1 limão", "3 colheres (sopa) de azeite", "2 colheres (sopa) de coentro ou salsinha picada", "Sal e pimenta a gosto"]}, {"g": "Para servir", "items": ["Torradas finas ou chips de mandioca"]}], "steps": ["<strong>Gele tudo.</strong> Deixe o atum, a tigela e a faca na geladeira por 20 minutos. Mantenha o atum gelado até a hora de montar.", "<strong>Corte o atum</strong> em cubos bem pequenos (cerca de 0,5 cm), com a faca bem afiada.", "<strong>Tempere o atum</strong> somente na hora de servir, com shoyu, óleo de gergelim, limão, gengibre e cebolinha. Misture delicadamente.", "<strong>Prepare o vinagrete:</strong> misture a cebola roxa, o tomate, o limão, o azeite e as ervas. Adicione o abacate por último e mexa com cuidado, para não amassar. Acerte o sal.", "<strong>Monte as taças:</strong> uma camada de vinagrete de abacate, uma de atum, e repita, terminando com o atum por cima.", "<strong>Sirva imediatamente</strong>, com as torradas separadas."], "dica": "O limão “cozinha” o peixe aos poucos. Tempere o atum só na hora de servir, para ele ficar fresco e vermelho, sem perder a textura.", "combina": "<a class=\"x\" href=\"#r03\">1.3</a> Roast Beef de Filé Mignon (como cardápio sofisticado), <a class=\"x\" href=\"#r19\">4.3</a> Belle Salade e um vinho branco seco.", "mesa": "taças individuais ou uma taça grande transparente, para as camadas aparecerem.", "pode": "corte os legumes do vinagrete 1 hora antes. O atum só na hora de montar. Gestantes e pessoas com imunidade baixa devem evitar o prato."}, {"id": "r09", "num": "2.3", "title": "Coquetel de Camarão com Molho Cremoso de Ervas", "rende": "8 porções", "tempo": "40 minutos", "dif": "Fácil", "hist": "O coquetel de camarão é um clássico das entradas elegantes, presente em festas e restaurantes há décadas. A graça está no contraste: camarões gelados e firmes, com um molho cremoso e fresco.", "groups": [{"g": "Camarões", "items": ["700 g de camarão médio, limpo e com a cauda", "1 limão cortado ao meio", "2 folhas de louro", "1 colher (sopa) de sal", "Gelo para o banho"]}, {"g": "Molho cremoso de ervas", "items": ["150 g de iogurte natural integral", "100 g de maionese", "Suco e raspas de 1/2 limão", "1 colher (sopa) de cebolinha picada", "1 colher (sopa) de endro (dill) ou salsinha picada", "Sal e pimenta a gosto"]}, {"g": "Para montar", "items": ["8 taças pequenas ou 1 taça grande", "Folhinhas de endro ou cebolinha para finalizar"]}], "steps": ["<strong>Ferva a água</strong> com o limão, o louro e o sal.", "<strong>Cozinhe os camarões</strong> por 2 a 3 minutos, só até ficarem rosados e firmes. Mais que isso e eles endurecem.", "<strong>Banho de gelo:</strong> passe os camarões imediatamente para uma tigela com água e gelo, por 5 minutos. Escorra e seque em papel-toalha.", "<strong>Molho:</strong> misture o iogurte, a maionese, o limão e as ervas. Acerte o sal e a pimenta.", "<strong>Monte:</strong> coloque o molho no fundo da taça e pendure os camarões na borda, com as caudas para fora.", "<strong>Finalize</strong> com as ervas e leve à geladeira até a hora de servir."], "dica": "O tempo de cozimento é curto. Assim que os camarões ficarem rosados e enrolados, tire do fogo e gele.", "combina": "<a class=\"x\" href=\"#r04\">1.4</a> Salmão com Crosta de Pistache, <a class=\"x\" href=\"#r16\">3.5</a> Cuscuz de Camarão e <a class=\"x\" href=\"#r17\">4.1</a> Salada Caprese Especial.", "mesa": "uma taça grande no centro de uma bandeja dourada, com os camarões formando uma coroa.", "pode": "cozinhe os camarões e faça o molho até 4 horas antes. Mantenha na geladeira e monte na hora."}, {"id": "r10", "num": "2.4", "title": "Mixed Nuts Spicy", "rende": "10 porções (petisco)", "tempo": "30 minutos", "dif": "Fácil", "hist": "Castanhas e frutas secas sempre estiveram na mesa das festas de fim de ano, uma tradição que vem da Europa. A versão apimentada, com um toque doce, é perfeita para beliscar enquanto os convidados chegam.", "groups": [{"g": "As castanhas", "items": ["500 g de castanhas variadas, sem sal (caju, nozes, amêndoas, pecã)"]}, {"g": "Tempero", "items": ["40 g de manteiga derretida", "2 colheres (sopa) de açúcar mascavo", "2 colheres (sopa) de mel", "1 colher (chá) de páprica defumada", "1/2 colher (chá) de pimenta caiena (ajuste ao gosto)", "1 colher (sopa) de alecrim picado fino", "1 colher (chá) de sal"]}], "steps": ["<strong>Preaqueça o forno a 160 °C</strong> e forre uma assadeira com papel-manteiga.", "<strong>Misture o tempero:</strong> manteiga, açúcar mascavo, mel, páprica, caiena, alecrim e sal.", "<strong>Envolva as castanhas</strong> no tempero, mexendo bem para todas ficarem cobertas.", "<strong>Espalhe</strong> em uma única camada na assadeira.", "<strong>Asse por 15 a 18 minutos</strong>, mexendo na metade do tempo, até ficarem douradas e perfumadas.", "<strong>Esfrie completamente</strong> sobre o papel. Elas ficam crocantes só depois de frias.", "<strong>Guarde</strong> em pote bem fechado, por até 7 dias."], "dica": "Vigie nos últimos minutos. O mel e o açúcar queimam rápido, e castanha queimada amarga.", "combina": "<a class=\"x\" href=\"#r07\">2.1</a> Brie Folhado, <a class=\"x\" href=\"#r11\">2.5</a> Tábua de Natal e espumante.", "mesa": "em uma tigela dourada em formato de estrela, se tiver, ou em pequenos potinhos individuais.", "pode": "pode ser feito até 7 dias antes. Faça no começo da semana e já tire uma tarefa da lista."}, {"id": "r11", "num": "2.5", "title": "Tábua de Natal (Apetizer Box)", "rende": "8 a 10 porções", "tempo": "30 minutos", "dif": "Fácil", "hist": "As tábuas de frios e queijos se inspiram na tradição europeia de servir pequenas porções antes da refeição. A regra é simples: textura, cor e contraste. Em uma tábua de Natal, o vermelho das frutas e o dourado das castanhas contam a história da festa.", "groups": [{"g": "Queijos (400 g)", "items": ["200 g de queijo brie", "200 g de queijo curado (tipo gouda ou parmesão em lascas)"]}, {"g": "Frios (200 g)", "items": ["200 g de presunto cru fatiado"]}, {"g": "Doces e frutas", "items": ["100 g de damascos secos", "100 g de tâmaras", "1 cacho pequeno de uvas verdes", "6 a 8 morangos", "1 pote de geleia de frutas vermelhas"]}, {"g": "Crocantes", "items": ["80 g de nozes e amêndoas", "1 baguete em fatias finas, ou torradas"]}], "steps": ["<strong>Tire os queijos da geladeira</strong> 30 minutos antes. Eles ficam mais saborosos em temperatura ambiente.", "<strong>Escolha uma tábua grande</strong> e comece pelos itens maiores: coloque o brie e o queijo curado em pontos diferentes.", "<strong>Coloque a geleia</strong> em um potinho e posicione perto dos queijos.", "<strong>Faça as ondas de presunto:</strong> dobre as fatias em “rosas” ou ondas, e distribua em grupos.", "<strong>Preencha os espaços</strong> com as frutas secas e frescas, em montinhos separados por cor.", "<strong>Complete com as castanhas</strong> nos espaços pequenos que sobraram.", "<strong>Coloque os pães</strong> em uma lateral, ou em uma cesta ao lado."], "dica": "Não deixe espaços vazios. A tábua mais bonita é a que parece farta, com cores alternadas e sem nenhuma parte “sem nada”.", "combina": "<a class=\"x\" href=\"#r10\">2.4</a> Mixed Nuts Spicy, <a class=\"x\" href=\"#r07\">2.1</a> Brie Folhado e vinho tinto leve ou espumante.", "mesa": "coloque a tábua no centro da mesa de entrada, com facas separadas para cada queijo.", "pode": "corte as frutas e dobre o presunto 2 horas antes e guarde coberto na geladeira. Monte a tábua na hora."}]}, {"n": 3, "name": "Acompanhamentos", "sub": "Os pratos que seguram a mesa. Arroz, massa e cuscuz que ninguém esquece.", "recs": [{"id": "r12", "num": "3.1", "title": "Arroz com Amêndoas", "rende": "10 porções", "tempo": "40 minutos", "dif": "Fácil", "hist": "Arroz com amêndoas é presença constante nas ceias brasileiras, ao lado dos outros arrozes de festa. A amêndoa faz parte da tradição natalina europeia e dá ao arroz branco uma crocância e uma cor de festa.", "groups": [{"g": "Arroz", "items": ["3 xícaras (600 g) de arroz agulhinha", "6 xícaras de água quente", "3 colheres (sopa) de manteiga", "1 cebola pequena picada", "2 dentes de alho amassados", "2 colheres (chá) de sal"]}, {"g": "Cobertura", "items": ["1 1/2 xícara (150 g) de amêndoas laminadas", "1 colher (sopa) de manteiga", "2 colheres (sopa) de salsinha picada (opcional)"]}], "steps": ["<strong>Toste as amêndoas</strong> em uma frigideira seca, em fogo médio, por 3 a 4 minutos, mexendo sempre, até dourar. Junte a manteiga, misture e reserve.", "<strong>Refogue</strong> a cebola e o alho na manteiga, em uma panela grande, por 3 minutos.", "<strong>Junte o arroz</strong> e mexa por 2 minutos, para os grãos ficarem soltinhos.", "<strong>Adicione a água quente e o sal.</strong> Quando ferver, reduza o fogo, tampe e cozinhe por 15 a 18 minutos, sem mexer.", "<strong>Desligue</strong> e deixe descansar tampado por 5 minutos.", "<strong>Solte o arroz</strong> com um garfo, sem amassar.", "<strong>Finalize</strong> cobrindo com as amêndoas tostadas e a salsinha."], "dica": "Coloque as amêndoas por cima só na hora de servir. Se ficarem sobre o arroz quente por muito tempo, perdem a crocância.", "combina": "<a class=\"x\" href=\"#r01\">1.1</a> Peru Assado, <a class=\"x\" href=\"#r02\">1.2</a> Pernil de Porco, <a class=\"x\" href=\"#r05\">1.5</a> Bacalhoada.", "mesa": "em uma travessa funda, com as amêndoas cobrindo toda a superfície.", "pode": "o arroz pode ser feito até 3 horas antes e mantido tampado. Toste as amêndoas só na hora."}, {"id": "r13", "num": "3.2", "title": "Arroz Byriani de Ervas", "rende": "10 porções", "tempo": "40 minutos", "dif": "Fácil", "hist": "O biryani é um prato de arroz aromático do sul da Ásia, famoso pelo uso do arroz basmati e de especiarias. Esta é uma versão de ervas e legumes, inspirada nesse estilo, colorida e perfumada, que combina muito bem com peixes e carnes.", "groups": [{"g": "Arroz", "items": ["3 xícaras (600 g) de arroz basmati", "4 1/2 xícaras de caldo de legumes ou água quente", "2 colheres (sopa) de manteiga", "1 colher (chá) de sal"]}, {"g": "Legumes", "items": ["1 cebola roxa picada", "2 cenouras em cubinhos", "1 xícara de ervilhas (frescas ou congeladas)"]}, {"g": "Ervas", "items": ["1/2 xícara de endro (dill) picado", "1/2 xícara de cebolinha picada", "1/2 xícara de salsinha picada"]}], "steps": ["<strong>Lave o arroz basmati</strong> em água corrente até a água sair quase transparente. Isso deixa os grãos soltinhos.", "<strong>Refogue</strong> a cebola roxa e a cenoura na manteiga por 5 minutos.", "<strong>Junte o arroz</strong> e mexa por 2 minutos.", "<strong>Adicione o caldo e o sal.</strong> Quando ferver, reduza o fogo, tampe e cozinhe por 12 a 15 minutos.", "<strong>Acrescente as ervilhas</strong> nos últimos 5 minutos de cozimento.", "<strong>Desligue e descanse</strong> tampado por 5 minutos.", "<strong>Misture as ervas</strong> e solte o arroz com um garfo."], "dica": "As ervas entram no final, fora do fogo. Assim, mantêm a cor verde viva e o perfume.", "combina": "<a class=\"x\" href=\"#r04\">1.4</a> Salmão com Crosta de Pistache, <a class=\"x\" href=\"#r01\">1.1</a> Peru Assado, <a class=\"x\" href=\"#r17\">4.1</a> Salada Caprese.", "mesa": "em uma travessa larga, com ramos de endro por cima.", "pode": "pode ser feito 2 horas antes. Misture as ervas no momento de servir."}, {"id": "r14", "num": "3.3", "title": "Arroz de Pato com Linguiça", "rende": "8 a 10 porções", "tempo": "3 horas", "dif": "Média", "hist": "O arroz de pato é um clássico da cozinha portuguesa, muito associado a festas, que chegou à mesa brasileira com a imigração. O pato cozido devagar solta um caldo saboroso, que cozinha o arroz.", "groups": [{"g": "Pato", "items": ["4 coxas com sobrecoxas de pato (cerca de 1,2 kg)", "2 colheres (sopa) de azeite", "1 cebola grande picada", "4 dentes de alho amassados", "1 xícara de vinho branco seco", "1 litro de caldo de galinha", "2 folhas de louro", "Sal e pimenta a gosto"]}, {"g": "Arroz", "items": ["3 xícaras (600 g) de arroz agulhinha", "250 g de linguiça portuguesa (ou paio) em rodelas", "1/2 xícara de salsinha picada"]}], "steps": ["<strong>Preaqueça o forno a 160 °C.</strong> Tempere o pato com sal e pimenta.", "<strong>Sele o pato</strong> em panela de ferro ou caçarola, com azeite, com a pele para baixo, por 8 minutos, até dourar. Vire e doure o outro lado. Retire e reserve.", "<strong>Refogue</strong> a cebola e o alho na gordura do pato por 5 minutos.", "<strong>Deglaceie</strong> com o vinho e deixe reduzir.", "<strong>Cozinhe o pato:</strong> volte as peças, adicione o caldo e o louro, tampe e leve ao forno por 1h45, até a carne soltar do osso.", "<strong>Desfie o pato</strong>, descartando ossos, pele em excesso e gordura. Reserve o caldo, coando e retirando o excesso de gordura (separe 6 xícaras de líquido).", "<strong>Cozinhe o arroz</strong> em uma panela com um pouco da gordura do pato. Junte o arroz, refogue por 2 minutos e adicione o caldo quente. Tampe e cozinhe por 15 a 18 minutos.", "<strong>Misture</strong> o pato desfiado ao arroz.", "<strong>Doure a linguiça</strong> em uma frigideira por 5 minutos e disponha por cima do arroz.", "<strong>Gratine</strong> por 10 minutos no forno a 200 °C. Finalize com salsinha."], "dica": "Não jogue fora o caldo do pato. Ele é o sabor do prato. Só retire a gordura que flutuar na superfície.", "combina": "<a class=\"x\" href=\"#r20\">4.4</a> Salada de Grãos Tradicional, <a class=\"x\" href=\"#r18\">4.2</a> Salada de Figos e <a class=\"x\" href=\"#r21\">5.1</a> Torta de Limão.", "mesa": "direto na travessa, com a linguiça em rodelas sobre o arroz.", "pode": "o pato pode ser cozido e desfiado 1 dia antes. Cozinhe o arroz no dia."}, {"id": "r15", "num": "3.4", "title": "Nhoque de Mandioquinha com Molho de Parmesão", "rende": "8 porções", "tempo": "1h30", "dif": "Média", "hist": "O nhoque é um clássico italiano, e no Brasil existe até a tradição de comer nhoque no dia 29 de cada mês. A mandioquinha (batata-baroa) dá uma versão brasileira, mais doce e macia.", "groups": [{"g": "Nhoque", "items": ["1 kg de mandioquinha (batata-baroa)", "2 gemas", "220 a 280 g de farinha de trigo (a quantidade varia)", "1 colher (chá) de sal", "1 pitada de noz-moscada"]}, {"g": "Molho de parmesão", "items": ["1 colher (sopa) de manteiga", "1 dente de alho amassado", "400 ml de creme de leite fresco", "120 g de queijo parmesão ralado", "2 colheres (sopa) de salsinha picada", "1 colher (chá) de azeite trufado (opcional)"]}], "steps": ["<strong>Cozinhe a mandioquinha</strong> descascada, em pedaços, em água com sal, por 25 minutos, até ficar bem macia.", "<strong>Escorra e deixe secar</strong> no escorredor por 5 minutos, para sair o vapor.", "<strong>Amasse ainda quente</strong>, com espremedor, até virar um purê liso.", "<strong>Misture</strong> as gemas, o sal e a noz-moscada.", "<strong>Adicione a farinha aos poucos</strong>, até a massa soltar das mãos. Use o mínimo de farinha: massa demais deixa o nhoque duro.", "<strong>Faça os rolinhos</strong>, corte em pedaços de 2 cm e passe levemente no garfo, para marcar.", "<strong>Ferva uma panela grande de água com sal.</strong> Cozinhe os nhoques em lotes: quando subirem à superfície, espere 1 minuto e retire com escumadeira.", "<strong>Molho:</strong> derreta a manteiga, doure o alho, junte o creme e cozinhe por 5 minutos. Adicione o parmesão e mexa até derreter.", "<strong>Misture</strong> os nhoques ao molho, por 1 minuto, e finalize com salsinha e azeite trufado."], "dica": "Faça um nhoque de teste. Cozinhe um só: se desmanchar na água, falta farinha; se ficar duro, tem demais.", "combina": "<a class=\"x\" href=\"#r03\">1.3</a> Roast Beef de Filé Mignon, <a class=\"x\" href=\"#r19\">4.3</a> Belle Salade, <a class=\"x\" href=\"#r24\">5.4</a> Torta Mousse de Chocolate Belga.", "mesa": "em uma travessa funda quente, com parmesão ralado extra por cima.", "pode": "modele os nhoques até 3 horas antes (em assadeira enfarinhada, na geladeira) ou congele crus. Cozinhe na hora."}, {"id": "r16", "num": "3.5", "title": "Cuscuz de Camarão com Molho de Tomate Fresco", "rende": "12 porções", "tempo": "1h30 (mais 30 minutos de descanso)", "dif": "Média", "hist": "O cuscuz paulista é uma criação brasileira, que adaptou o cuscuz do norte da África usando farinha de milho. É presença forte em festas e ceias, principalmente nas versões com camarão e legumes.", "groups": [{"g": "Molho", "items": ["1,2 kg de tomates maduros, sem pele e sem sementes, picados", "2 cebolas picadas", "4 dentes de alho", "1 pimentão vermelho picado", "1/2 xícara de azeite", "1 xícara de cheiro-verde picado", "700 g de camarão médio, limpo", "600 ml de caldo de peixe ou camarão", "Sal e pimenta a gosto"]}, {"g": "Massa", "items": ["500 g de farinha de milho flocada (flocão)", "1 xícara de água com sal (para hidratar)"]}, {"g": "Decoração e montagem", "items": ["4 ovos cozidos em fatias", "10 azeitonas verdes", "2 tomates em rodelas", "1 forma de pudim com furo central (cerca de 24 cm), untada"]}], "steps": ["<strong>Hidrate o flocão:</strong> misture com a água com sal e deixe descansar 15 minutos.", "<strong>Refogue</strong> a cebola, o alho e o pimentão no azeite por 5 minutos.", "<strong>Adicione os tomates</strong> e cozinhe por 15 minutos, até virar um molho.", "<strong>Junte os camarões</strong> e cozinhe por 3 minutos. Acrescente o cheiro-verde.", "<strong>Coloque o caldo</strong> e deixe ferver.", "<strong>Junte o flocão hidratado</strong> aos poucos, mexendo, até a massa ficar úmida e soltar do fundo da panela, cerca de 5 minutos.", "<strong>Prepare a forma:</strong> forre o fundo com rodelas de tomate, fatias de ovo e azeitonas, em desenho bonito.", "<strong>Coloque a massa</strong> na forma, pressionando bem com uma colher.", "<strong>Descanse 30 minutos.</strong>", "<strong>Desenforme</strong> virando sobre a travessa. Sirva com molho de tomate extra."], "dica": "Pressione bem a massa na forma. Se ficar solta, o cuscuz desmancha quando você desenformar.", "combina": "<a class=\"x\" href=\"#r09\">2.3</a> Coquetel de Camarão, <a class=\"x\" href=\"#r17\">4.1</a> Salada Caprese, <a class=\"x\" href=\"#r18\">4.2</a> Salada de Figos.", "mesa": "desenformado no centro da travessa, com camarões grandes extras na volta.", "pode": "o cuscuz pode ser montado 1 dia antes e mantido na geladeira. Desenforme na hora de servir."}]}, {"n": 4, "name": "Saladas", "sub": "Frescor, cor e crocância para equilibrar uma mesa farta.", "recs": [{"id": "r17", "num": "4.1", "title": "Salada Caprese Especial na Travessa", "rende": "8 porções", "tempo": "20 minutos", "dif": "Fácil", "hist": "A caprese nasceu na ilha de Capri, na Itália, e suas três cores (tomate, mussarela e manjericão) lembram a bandeira italiana. Nesta versão de festa, entram tomates coloridos e pistache picado.", "groups": [{"g": "Salada", "items": ["500 g de tomates-cereja coloridos", "3 tomates italianos maduros", "400 g de mussarela de búfala em bolinhas", "1 maço de manjericão fresco"]}, {"g": "Finalização", "items": ["50 g de pistache picado", "4 colheres (sopa) de azeite extravirgem", "1 colher (sopa) de vinagre balsâmico (ou creme balsâmico)", "Sal flor e pimenta-do-reino a gosto"]}], "steps": ["<strong>Lave e seque</strong> bem os tomates e o manjericão.", "<strong>Corte</strong> os tomates-cereja ao meio e os italianos em fatias grossas.", "<strong>Escorra</strong> a mussarela e seque com papel-toalha.", "<strong>Monte na travessa:</strong> alterne tomates e bolinhas de mussarela, com folhas de manjericão no meio.", "<strong>Tempere</strong> com azeite, o balsâmico e o sal flor, só na hora de servir.", "<strong>Finalize</strong> com pistache picado e pimenta."], "dica": "Tomate gelado perde o sabor. Retire da geladeira 30 minutos antes de montar e tempere só no final, para não soltar água.", "combina": "<a class=\"x\" href=\"#r04\">1.4</a> Salmão com Crosta de Pistache, <a class=\"x\" href=\"#r06\">1.6</a> Lasanha com Ragu, <a class=\"x\" href=\"#r16\">3.5</a> Cuscuz de Camarão.", "mesa": "travessa larga e rasa, com folhas de manjericão inteiras por cima.", "pode": "corte os tomates 1 hora antes, mas tempere só na hora. A mussarela deve ficar na água até montar."}, {"id": "r18", "num": "4.2", "title": "Salada de Figos com Presunto Cru e Nozes", "rende": "8 porções", "tempo": "20 minutos", "dif": "Fácil", "hist": "O figo é uma fruta de tradição mediterrânea, e a combinação do doce do figo com o salgado do presunto cru é um clássico. A estação do figo fresco no Brasil costuma ser no verão. Se não encontrar, a receita funciona com ameixas frescas ou pêssegos.", "groups": [{"g": "Salada", "items": ["300 g de folhas variadas (alface roxa, crespa, rúcula)", "8 figos frescos cortados em quartos", "150 g de presunto cru fatiado", "150 g de mussarela de búfala em bolinhas", "60 g de nozes em pedaços"]}, {"g": "Molho de mel e balsâmico", "items": ["4 colheres (sopa) de azeite", "2 colheres (sopa) de vinagre balsâmico", "1 colher (sopa) de mel", "1 colher (chá) de mostarda Dijon", "Sal e pimenta a gosto"]}], "steps": ["<strong>Lave as folhas</strong>, seque bem e rasgue em pedaços grandes com as mãos.", "<strong>Faça o molho:</strong> bata em um pote fechado o azeite, o balsâmico, o mel, a mostarda, o sal e a pimenta.", "<strong>Monte as folhas</strong> em uma travessa grande, em camada fofa.", "<strong>Distribua</strong> os figos, as bolinhas de mussarela e o presunto em “rosas”.", "<strong>Espalhe as nozes</strong> por cima.", "<strong>Regue com o molho</strong> só na hora de servir."], "dica": "Folhas molhadas diluem o molho e murcham. Seque muito bem depois de lavar, de preferência em um centrifugador de salada.", "combina": "<a class=\"x\" href=\"#r01\">1.1</a> Peru Assado, <a class=\"x\" href=\"#r14\">3.3</a> Arroz de Pato, <a class=\"x\" href=\"#r16\">3.5</a> Cuscuz de Camarão.", "mesa": "monte alto, com os figos aparecendo, e sirva o molho à parte em uma jarrinha.", "pode": "lave e seque as folhas de manhã, guarde na geladeira. O molho pode ser feito 1 dia antes."}, {"id": "r19", "num": "4.3", "title": "Belle Salade", "rende": "8 porções", "tempo": "25 minutos", "dif": "Fácil", "hist": "Uma salada de inspiração mediterrânea que mistura doce e salgado: melão com presunto cru é uma dupla clássica da Itália. O molho cítrico dá frescor e leveza.", "groups": [{"g": "Salada", "items": ["300 g de folhas variadas (alface americana, roxa, crespa)", "1/2 melão cantaloupe (ou melão-rocha) em tiras finas", "4 damascos frescos ou pêssegos em fatias (opcional)", "120 g de presunto cru fatiado", "100 g de mussarela de búfala em bolinhas"]}, {"g": "Molho cítrico", "items": ["Suco de 1 laranja", "4 colheres (sopa) de azeite", "1 colher (chá) de mostarda", "1 colher (chá) de mel", "Sal e pimenta a gosto"]}], "steps": ["<strong>Lave e seque</strong> as folhas e rasgue em pedaços.", "<strong>Corte o melão</strong> em tiras finas, com um descascador de legumes (as fitas ficam elegantes).", "<strong>Prepare o molho:</strong> misture o suco de laranja, o azeite, a mostarda e o mel até emulsionar. Tempere.", "<strong>Monte as folhas</strong> no fundo da travessa.", "<strong>Distribua</strong> as fitas de melão, os damascos, as bolinhas de mussarela e o presunto em ondas.", "<strong>Regue</strong> com o molho na hora de servir."], "dica": "Escolha o melão no ponto: perfumado e levemente macio na ponta. Melão verde não tem doçura e o prato perde o equilíbrio.", "combina": "<a class=\"x\" href=\"#r03\">1.3</a> Roast Beef, <a class=\"x\" href=\"#r06\">1.6</a> Lasanha com Ragu, <a class=\"x\" href=\"#r15\">3.4</a> Nhoque de Mandioquinha.", "mesa": "monte em travessa larga, com as fitas de melão em destaque.", "pode": "lave as folhas e prepare o molho antes. Corte o melão no máximo 1 hora antes."}, {"id": "r20", "num": "4.4", "title": "Salada de Grãos Tradicional", "rende": "10 porções", "tempo": "50 minutos", "dif": "Fácil", "hist": "Grãos e cereais estão na base da alimentação mediterrânea e do Oriente Médio. Esta salada é perfumada, rende bastante e pode ser feita com antecedência, o que a torna uma aliada de quem cozinha para muita gente.", "groups": [{"g": "Grãos", "items": ["1 xícara de trigo em grãos", "1/2 xícara de quinoa", "1/2 xícara de lentilha"]}, {"g": "Legumes e ervas", "items": ["1 cenoura em cubinhos", "1 abobrinha em cubinhos", "1/2 cebola roxa picada", "1/2 xícara de salsinha picada", "1/4 xícara de hortelã picada", "60 g de amêndoas laminadas tostadas"]}, {"g": "Molho", "items": ["Suco de 2 limões", "5 colheres (sopa) de azeite", "1 colher (sopa) de mel", "1/2 colher (chá) de canela", "Sal e pimenta a gosto"]}, {"g": "Para finalizar (opcional)", "items": ["1 alho-poró cortado em fios finos e frito até dourar"]}], "steps": ["<strong>Cozinhe os grãos separadamente:</strong> o trigo por 30 a 40 minutos, a lentilha por 15 a 20 minutos e a quinoa por 12 minutos, cada um em água com sal. Escorra e esfrie.", "<strong>Refogue</strong> a cenoura e a abobrinha rapidamente em azeite, por 3 minutos. Elas devem ficar firmes.", "<strong>Faça o molho:</strong> misture o limão, o azeite, o mel, a canela, o sal e a pimenta.", "<strong>Misture</strong> os grãos frios, os legumes, a cebola roxa e as ervas.", "<strong>Tempere</strong> com o molho e deixe descansar por 20 minutos.", "<strong>Finalize</strong> com as amêndoas e o alho-poró frito."], "dica": "Misture o molho ainda com os grãos mornos: eles absorvem melhor o tempero e ficam mais saborosos no dia seguinte.", "combina": "<a class=\"x\" href=\"#r02\">1.2</a> Pernil de Porco, <a class=\"x\" href=\"#r05\">1.5</a> Bacalhoada, <a class=\"x\" href=\"#r14\">3.3</a> Arroz de Pato.", "mesa": "monte em montanha, com as amêndoas e o alho-poró frito por cima.", "pode": "pode ser feita 1 dia antes, sem as amêndoas e o alho-poró frito. Finalize na hora."}]}, {"n": 5, "name": "Sobremesas Natalinas", "sub": "O final que fica na memória. Doces de festa, com passo a passo para não ter erro.", "recs": [{"id": "r21", "num": "5.1", "title": "Torta de Limão com Merengue Maçaricado", "rende": "10 fatias (forma de 20 cm)", "tempo": "1h30 (mais 4 horas de geladeira)", "dif": "Média", "hist": "A torta de limão é muito querida no Brasil, e a versão com merengue lembra a clássica lemon meringue pie. O contraste entre o creme azedinho e a cobertura doce e tostada é o que a torna tão marcante.", "groups": [{"g": "Massa (sablée)", "items": ["250 g de farinha de trigo", "125 g de manteiga gelada em cubos", "70 g de açúcar de confeiteiro", "1 gema", "2 colheres (sopa) de água gelada", "1 pitada de sal"]}, {"g": "Recheio de limão", "items": ["1 lata de leite condensado (395 g)", "3 gemas", "1/2 xícara de suco de limão (cerca de 4 limões)", "Raspas de 2 limões"]}, {"g": "Merengue suíço", "items": ["3 claras", "180 g de açúcar refinado"]}], "steps": ["<strong>Faça a massa:</strong> misture a farinha, o açúcar e o sal. Adicione a manteiga e esfarele com as pontas dos dedos. Junte a gema e a água. Misture só até unir.", "<strong>Descanse a massa</strong> na geladeira, enrolada em filme, por 30 minutos.", "<strong>Forre a forma:</strong> abra a massa e forre uma forma de 20 cm de fundo removível. Fure com um garfo e leve ao congelador por 15 minutos.", "<strong>Pré-asse a massa</strong> a 180 °C por 20 a 25 minutos, com papel-manteiga e pesos (feijão) por cima nos primeiros 15 minutos. Retire os pesos e asse mais 5 a 10 minutos, até dourar.", "<strong>Recheio:</strong> misture o leite condensado, as gemas, o suco e as raspas de limão.", "<strong>Despeje na massa</strong> ainda morna e asse por 10 a 12 minutos a 160 °C, úcar de confeiteiro polvilhado em desenhos, usando uma tira de papel como máscara.", "pode": "as placas assadas podem ser feitas 1 dia antes (em pote fechado). Monte no dia ou na véspera."}]}]};
